# HMATIAS GitHub Pages publication policy.
# Branch-based Pages must never publish internal Source AO desks, backend code,
# operational documentation or repository/development files.
include:
  - .well-known

exclude:
  - .github
  - .gitignore
  - .source-ao-production-release
  - .assetsignore
  - SECURITY.md
  - OWNERSHIP.md
  - README.txt
  - LICENSE
  - package.json
  - package-lock.json
  - vite.config.js
  - wrangler.jsonc
  - docs
  - cloudflare-ai
  - lead-intake
  - source-ao/README.md
  - source-ao/backend
  - source-ao/docs
  - source-ao/schemas
  - source-ao/data/suppliers.json
  - source-ao/data/services.json
  - source-ao/data/observations.json
  - source-ao/data/verification-queue.json
  - source-ao/data/acceptance-cases.json
  - source-ao/data-contract.json
  - source-ao/validate-data.mjs
  - source-ao/ops.html
  - source-ao/ops.js
  - source-ao/ops.css
  - source-ao/review.html
  - source-ao/review.js
  - source-ao/review.css
  - source-ao/requests.html
  - source-ao/requests.js
  - source-ao/requests.css
  - source-ao/supplier-discovery.html
  - source-ao/supplier-discovery.js
  - source-ao/website-leads.html
  - source-ao/website-leads-ops.js
