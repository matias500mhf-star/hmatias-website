name: HMATIAS Lighthouse Quality

on:
  pull_request:
    branches: ["main"]
  workflow_call:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Start local site
        shell: bash
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/hmatias-http.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/hmatias-http.log
          exit 1
      - name: Audit homepages and credibility pages
        shell: bash
        run: |
          npx --yes lighthouse@latest http://127.0.0.1:8080/ \
            --quiet --chrome-flags="--headless --no-sandbox" \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json --output-path=./lighthouse-pt-mobile.json
          npx --yes lighthouse@latest http://127.0.0.1:8080/en.html \
            --quiet --chrome-flags="--headless --no-sandbox" \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json --output-path=./lighthouse-en-mobile.json
          npx --yes lighthouse@latest http://127.0.0.1:8080/ \
            --quiet --preset=desktop --chrome-flags="--headless --no-sandbox" \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json --output-path=./lighthouse-pt-desktop.json
          npx --yes lighthouse@latest http://127.0.0.1:8080/en.html \
            --quiet --preset=desktop --chrome-flags="--headless --no-sandbox" \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json --output-path=./lighthouse-en-desktop.json
          for page in credibilidade credibility; do
            npx --yes lighthouse@latest "http://127.0.0.1:8080/$page.html" \
              --quiet --chrome-flags="--headless --no-sandbox" \
              --only-categories=performance,accessibility,best-practices,seo \
              --output=json --output-path="./lighthouse-$page-mobile.json"
            npx --yes lighthouse@latest "http://127.0.0.1:8080/$page.html" \
              --quiet --preset=desktop --chrome-flags="--headless --no-sandbox" \
              --only-categories=performance,accessibility,best-practices,seo \
              --output=json --output-path="./lighthouse-$page-desktop.json"
          done
      - name: Report and enforce quality floor
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          floors = {
              'performance': 0.70,
              'accessibility': 0.90,
              'best-practices': 0.90,
              'seo': 0.90,
          }
          perf_metrics = [
              ('first-contentful-paint', 'FCP'),
              ('largest-contentful-paint', 'LCP'),
              ('speed-index', 'Speed Index'),
              ('total-blocking-time', 'TBT'),
              ('cumulative-layout-shift', 'CLS'),
          ]
          failures = []
          for path in sorted(Path('.').glob('lighthouse-*.json')):
              data = json.loads(path.read_text())
              cats = data['categories']
              scores = {key: cats[key]['score'] for key in floors}
              rendered = ' | '.join(f"{key}={round(value * 100)}" for key, value in scores.items())
              print(f"{path.name}: {rendered}")

              metric_parts = []
              for audit_id, label in perf_metrics:
                  audit = data.get('audits', {}).get(audit_id, {})
                  display = audit.get('displayValue')
                  numeric = audit.get('numericValue')
                  score = audit.get('score')
                  value = display if display is not None else numeric
                  metric_parts.append(f"{label}={value} (score={score})")
              print('Performance metrics: ' + ' | '.join(metric_parts))

              print(f"Accessibility findings for {path.name}:")
              seen = set()
              for ref in cats['accessibility'].get('auditRefs', []):
                  audit_id = ref.get('id')
                  if not audit_id or audit_id in seen:
                      continue
                  seen.add(audit_id)
                  audit = data.get('audits', {}).get(audit_id, {})
                  score = audit.get('score')
                  if score is not None and score < 1:
                      title = audit.get('title', audit_id)
                      display = audit.get('displayValue', '')
                      detail = f" | {display}" if display else ''
                      print(f" - {audit_id}: score={score} | {title}{detail}")
                      items = (audit.get('details') or {}).get('items') or []
                      for item in items[:12]:
                          node = item.get('node') if isinstance(item, dict) else None
                          if isinstance(node, dict):
                              selector = node.get('selector', '')
                              snippet = node.get('snippet', '')
                              explanation = node.get('explanation', '')
                              print(f"   selector: {selector}")
                              print(f"   snippet: {snippet}")
                              if explanation:
                                  print(f"   explanation: {explanation}")
                          elif isinstance(item, dict):
                              print('   item:', json.dumps(item, ensure_ascii=False)[:1200])

              for key, floor in floors.items():
                  if scores[key] < floor:
                      failures.append(f"{path.name}: {key} {scores[key]:.2f} < {floor:.2f}")
          if failures:
              print('Quality floor FAILED:')
              for item in failures:
                  print(' -', item)
              raise SystemExit(1)
          print('HMATIAS Lighthouse quality floor OK.')
          PY
      - name: Extract visual evidence
        if: always()
        run: |
          python3 - <<'PY'
          import base64
          import json
          from pathlib import Path
          for path in Path('.').glob('lighthouse-*.json'):
              report = json.loads(path.read_text())
              shots = {
                  'viewport': report.get('audits', {}).get('final-screenshot', {}).get('details', {}).get('data'),
                  'full': report.get('fullPageScreenshot', {}).get('screenshot', {}).get('data'),
              }
              for kind, data in shots.items():
                  if data and ',' in data:
                      ext = 'jpg' if 'image/jpeg' in data.split(',', 1)[0] else 'png'
                      Path(f'{path.stem}-{kind}.{ext}').write_bytes(base64.b64decode(data.split(',', 1)[1]))
                      if path.stem in ('lighthouse-pt-mobile', 'lighthouse-pt-desktop', 'lighthouse-credibilidade-mobile', 'lighthouse-credibilidade-desktop') and kind == 'full':
                          print(f'HMATIAS_VISUAL:{path.stem}:{data}')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-review-${{ github.sha }}
          path: |
            lighthouse-*.json
            lighthouse-*.jpg
            lighthouse-*.png
          retention-days: 14
