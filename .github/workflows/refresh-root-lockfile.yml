name: HMATIAS Root Dependency Lock Refresh

on:
  push:
    branches:
      - "feat/hmatias-platform-modernization-20261111"
    paths:
      - "package.json"

permissions:
  contents: write

concurrency:
  group: hmatias-root-lock-refresh
  cancel-in-progress: true

jobs:
  refresh:
    name: Resolve and verify the root dependency lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v7
        with:
          ref: feat/hmatias-platform-modernization-20261111

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Resolve pinned dependencies without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Update the vulnerable transitive source-map package
        run: npm update source-map-js --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify patched package versions
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const vite = lock.packages?.['node_modules/vite']?.version;
          const sourceMap = lock.packages?.['node_modules/source-map-js']?.version;
          console.log({vite, sourceMap});
          if (vite !== '8.3.7') throw new Error('Expected Vite 8.3.7, received ' + vite);
          const parts = String(sourceMap).split('.').map(Number);
          if (!(parts[0] > 1 || (parts[0] === 1 && (parts[1] > 2 || (parts[1] === 2 && parts[2] >= 2)))) {
            throw new Error('Expected source-map-js >= 1.2.2, received ' + sourceMap);
          }
          NODE

      - name: Reject remaining high or critical advisories
        shell: bash
        run: |
          set +e
          npm audit --json > "$RUNNER_TEMP/hmatias-npm-audit.json"
          audit_exit=$?
          set -e
          node - "$RUNNER_TEMP/hmatias-npm-audit.json" "$audit_exit" <<'NODE'
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const counts = report.metadata?.vulnerabilities ?? {};
          console.log('Dependency advisory summary:', JSON.stringify(counts));
          for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
            console.log('- ' + item.severity + ': ' + name + '; range=' + item.range + '; fix=' + JSON.stringify(item.fixAvailable));
          }
          if ((counts.high ?? 0) > 0 || (counts.critical ?? 0) > 0) {
            console.error('High or critical dependency advisories remain; lockfile will not be committed.');
            process.exit(1);
          }
          console.log('npm audit exit code:', process.argv[3]);
          NODE

      - name: Commit only the refreshed lockfile to the isolated branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh root dependency lockfile"
          git push origin HEAD:feat/hmatias-platform-modernization-20261111
