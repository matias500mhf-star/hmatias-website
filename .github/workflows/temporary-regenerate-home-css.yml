name: Temporary regenerate homepage CSS bundles

on:
  push:
    branches:
      - fix/assistant-cache-deploy-gate-20261027

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned build tooling
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Regenerate CSS bundles and validate
        run: |
          node scripts/build-home-css.mjs --write
          node scripts/check-commercial-audit.mjs
      - name: Commit generated bundles if changed
        shell: bash
        run: |
          if git diff --quiet -- home-base.css home-details.css clean-base.css clean-details.css; then
            echo "Generated CSS bundles already match their source stylesheets."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home-base.css home-details.css clean-base.css clean-details.css
          git commit -m "Build generated homepage CSS bundles"
          git push origin "HEAD:${GITHUB_REF_NAME}"
