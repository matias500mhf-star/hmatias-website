name: Source AO Data Quality

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'source-ao/data/**'
      - 'source-ao/schemas/**'
      - 'source-ao/backend/**'
      - 'source-ao/docs/**'
      - 'source-ao/*.js'
      - 'source-ao/*.html'
      - 'source-ao/*.css'
      - 'source-ao/data-contract.json'
      - 'source-ao/validate-data.mjs'
      - '.github/workflows/source-ao-staging-deploy.yml'
  push:
    branches:
      - source-ao-v1
    paths:
      - 'source-ao/data/**'
      - 'source-ao/schemas/**'
      - 'source-ao/backend/**'
      - 'source-ao/docs/**'
      - 'source-ao/*.js'
      - 'source-ao/*.html'
      - 'source-ao/*.css'
      - 'source-ao/data-contract.json'
      - 'source-ao/validate-data.mjs'
      - '.github/workflows/source-ao-staging-deploy.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Source AO data
        run: node source-ao/validate-data.mjs
      - name: Validate institutional website leads migration
        run: python3 source-ao/backend/scripts/test-website-leads-migration.py
      - name: Validate synthetic RFQ alert isolation
        run: python3 source-ao/backend/scripts/test-synthetic-alert-migration.py
      - name: Validate public catalogue privacy boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"item-ppe-workplace-safety"' source-ao/data/catalog.json
          grep -q '"item-professional-workwear-uniforms"' source-ao/data/catalog.json
          grep -q '"item-furniture-workspaces"' source-ao/data/catalog.json
          grep -q '"item-partition-systems"' source-ao/data/catalog.json
          grep -q '"item-vci-corrosion-protection"' source-ao/data/catalog.json
          grep -q '"item-industrial-protective-coatings"' source-ao/data/catalog.json
          grep -q '"item-hydrotest-corrosion-treatment"' source-ao/data/catalog.json
          grep -q 'LINHAS COMPLEMENTARES DE FORNECIMENTO' supply.html
          grep -q 'COMPLEMENTARY SUPPLY LINES' supply-en.html
          ! grep -RqiE 'commercial_priority|next_action|relationship_stage|private_contact|internal_notes' source-ao/data/catalog.json supply.html supply-en.html

      - name: Validate frontend scripts syntax
        run: |
          node --check source-ao/data-engine.js
          node --check source-ao/sourceao.js
          node --check source-ao/verified-results.js
          node --check source-ao/runtime-config.js
          node --check source-ao/api-client.js
          node --check source-ao/ops.js
          node --check source-ao/opportunity-radar.js
          node --check source-ao/confirm.js
          node --check source-ao/review.js
          node --check source-ao/sourcing-ui.js
          node --check source-ao/track.js
          node --check source-ao/requests.js
          node --check source-ao/rfq.js
          node --check source-ao/rfq-model.js

      - name: Audit public SOURCE AO pages, routes and identity
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import PurePosixPath
          from urllib.parse import urlsplit
          import posixpath
          import re
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = Path('.')
          pages = [
              'source-ao/index.html',
              'source-ao/opportunity-radar.html',
              'source-ao/rfq.html',
              'source-ao/track.html',
              'source-ao/confirm.html',
              'source-ao/partner-application.html',
              'source-ao/partner-application-en.html',
              'source-ao/privacy.html',
              'source-ao/privacy-en.html',
              'source-ao/terms.html',
              'source-ao/terms-en.html',
          ]
          failures = []

          class AuditHTML(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.ids = []
                  self.links = []
                  self.buttons = []
                  self.icon_links = []
                  self.attrs_by_id = {}
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if a.get('id'):
                      self.ids.append(a['id'])
                      self.attrs_by_id[a['id']] = a
                  if tag in ('a', 'link') and a.get('href') is not None:
                      self.links.append(a['href'])
                  if tag in ('img', 'script', 'link') and a.get('src'):
                      self.links.append(a['src'])
                  if tag == 'link' and 'icon' in (a.get('rel') or '').split():
                      self.icon_links.append(a.get('href', ''))
                  if tag == 'button':
                      self.buttons.append(a)

          parsed_pages = {}
          for page in pages:
              target = root / page
              if not target.is_file():
                  failures.append(f'missing page: {page}')
                  continue
              content = target.read_text(encoding='utf-8')
              parser = AuditHTML()
              parser.feed(content)
              parser.close()
              parsed_pages[page] = (content, parser)
              duplicates = sorted({item for item in parser.ids if parser.ids.count(item) > 1})
              if duplicates:
                  failures.append(f'{page}: duplicate IDs: {duplicates}')
              if not parser.icon_links or any(not href for href in parser.icon_links):
                  failures.append(f'{page}: missing usable favicon link')
              for href in parser.icon_links:
                  url = urlsplit(href)
                  local = url.path
                  if not local:
                      failures.append(f'{page}: empty icon path')
                      continue
                  if local.startswith('/'):
                      local_path = posixpath.normpath(local.lstrip('/'))
                  else:
                      local_path = posixpath.normpath(str(PurePosixPath(page).parent / local))
                  if local_path == '.' or not (root / local_path).is_file():
                      failures.append(f'{page}: favicon asset missing: {href}')
              for attrs in parser.buttons:
                  if attrs.get('type') not in ('button', 'submit', 'reset'):
                      failures.append(f'{page}: button without explicit valid type: {attrs}')
              for href in parser.links:
                  if not href or href.startswith('#'):
                      continue
                  url = urlsplit(href)
                  if url.scheme or url.netloc:
                      continue
                  local = url.path
                  if not local:
                      local_path = page
                  elif local.startswith('/'):
                      local_path = posixpath.normpath(local.lstrip('/'))
                  else:
                      local_path = posixpath.normpath(str(PurePosixPath(page).parent / local))
                  if local_path in ('', '.'):
                      local_path = 'index.html'
                  if local_path.endswith('/'):
                      local_path = posixpath.join(local_path, 'index.html')
                  if not (root / local_path).is_file():
                      failures.append(f'{page}: local target missing: {href} -> {local_path}')
              for match in re.finditer(r'href="#([^"]+)"', content):
                  anchor = match.group(1)
                  if anchor not in parser.ids:
                      failures.append(f'{page}: same-page anchor missing: #{anchor}')
              html_lang = re.search(r'<html\b[^>]*\blang="([^"]+)"', content, re.I)
              if not html_lang:
                  failures.append(f'{page}: missing html lang attribute')

          # Locale-routing and input semantics that previously drifted.
          home = parsed_pages.get('source-ao/index.html', ('', None))[0]
          radar = parsed_pages.get('source-ao/opportunity-radar.html', ('', None))[0]
          home_js = (root / 'source-ao/sourceao.js').read_text(encoding='utf-8')
          radar_js = (root / 'source-ao/opportunity-radar.js').read_text(encoding='utf-8')
          rfq_js = (root / 'source-ao/rfq.js').read_text(encoding='utf-8')
          if 'min="0.001"' not in home or 'id="quantityInput"' not in home:
              failures.append('homepage sourcing quantity must require a positive amount')
          if 'autocomplete="off"' not in home[home.find('id="requestContact"')-100:home.find('id="requestContact"')+180]:
              failures.append('mixed phone/email contact field must not claim email autocomplete')
          if re.search(r'<button(?![^>]*\btype=)[^>]*\bclass="category"', home):
              failures.append('homepage quick category buttons must declare type=button')
          if re.search(r'<button(?![^>]*\btype=)[^>]*\bdata-(?:area|format)=', radar):
              failures.append('Radar filter buttons must declare type=button')
          for label, script in [('homepage', home_js), ('Radar', radar_js)]:
              if "$('[data-href-pt][data-href-en]')" not in script:
                  failures.append(f'{label}: locale links must update all matching elements')
              if "$('[data-i18n-alt]')" not in script:
                  failures.append(f'{label}: localized image alt text must update all matching elements')
          if "new URLSearchParams(window.location.search).get('lang')" not in home_js:
              failures.append('homepage must initialize PT/EN from the lang query')
          if "new URLSearchParams(window.location.search).get('lang')" not in radar_js:
              failures.append('Radar must initialize PT/EN from the lang query')
          if "location:o.location||'Angola',lang" not in radar_js:
              failures.append('Radar request action must preserve the selected language')
          if "document.querySelectorAll('[data-href-pt][data-href-en]')" not in rfq_js:
              failures.append('RFQ links must preserve the selected language')

          # Private views must never become public search results or leak referrers.
          for page in ['source-ao/track.html', 'source-ao/confirm.html',
                       'source-ao/partner-application.html', 'source-ao/partner-application-en.html']:
              content = parsed_pages.get(page, ('', None))[0]
              if 'noindex,nofollow,noarchive' not in content and 'noindex,follow' not in content:
                  failures.append(f'{page}: missing noindex policy')
              if 'no-referrer' not in content:
                  failures.append(f'{page}: missing no-referrer policy')
          for page, script_path in [('source-ao/track.html','source-ao/track.js'),
                                    ('source-ao/confirm.html','source-ao/confirm.js')]:
              content = parsed_pages.get(page, ('', None))[0]
              script = (root / script_path).read_text(encoding='utf-8')
              if 'id="langToggle"' not in content or 'function applyLanguage()' not in script:
                  failures.append(f'{page}: private flow must provide PT/EN language controls')

          # The newly added English legal pages must be present in sitemap with paired alternates.
          sitemap_path = root / 'sitemap.xml'
          try:
              tree = ET.parse(sitemap_path)
              ns = {'sm':'http://www.sitemaps.org/schemas/sitemap/0.9',
                    'xhtml':'http://www.w3.org/1999/xhtml'}
              entries = {}
              for entry in tree.getroot().findall('sm:url', ns):
                  loc = entry.find('sm:loc', ns)
                  if loc is None or not loc.text:
                      continue
                  entries[loc.text.strip()] = {item.attrib.get('hreflang'):item.attrib.get('href')
                                               for item in entry.findall('xhtml:link', ns)}
              for stem in ('privacy','terms'):
                  pt = f'https://comercialhmatiasps.com/source-ao/{stem}.html'
                  en = f'https://comercialhmatiasps.com/source-ao/{stem}-en.html'
                  for url, expected_lang, other in [(pt,'pt-AO',en),(en,'en',pt)]:
                      if url not in entries:
                          failures.append(f'sitemap missing legal URL: {url}')
                          continue
                      if entries[url].get(expected_lang) != url or entries[url].get('x-default') != pt:
                          failures.append(f'sitemap locale alternates invalid for {url}')
                      if entries[url].get('en' if expected_lang == 'pt-AO' else 'pt-AO') != other:
                          failures.append(f'sitemap cross-language alternate invalid for {url}')
          except Exception as exc:
              failures.append(f'sitemap.xml failed to parse: {exc}')

          en_partner = parsed_pages.get('source-ao/partner-application-en.html', ('', None))[0]
          for stale in ('IDENTIFICAÇÃO','CAPACIDADE','CONTACTO E EVIDÊNCIA','Não envie','Triagem','Classificação','Estar na base'):
              if stale in en_partner:
                  failures.append(f'English partner form contains untranslated text: {stale}')

          if failures:
              print('SOURCE AO page audit FAILED:')
              for item in failures:
                  print(' - ' + item)
              raise SystemExit(1)
          print(f'SOURCE AO page audit PASS: {len(pages)} pages, local links/assets, IDs, anchors, button types, locale routing, private-page headers and sitemap alternates.')
          PY

      - name: Validate Ops Desk security contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'type="password"' source-ao/ops.html
          grep -q 'runtime-config.js' source-ao/ops.html
          grep -q "let adminToken=''" source-ao/ops.js
          grep -q 'confirmation_url:discardedConfirmationUrl' source-ao/ops.js
          ! grep -Eq 'localStorage\.(setItem|getItem)\([^)]*adminToken|sessionStorage\.(setItem|getItem)\([^)]*adminToken' source-ao/ops.js
      - name: Validate Review Desk approval gate
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'noindex,nofollow,noarchive' source-ao/review.html
          grep -q 'no-referrer' source-ao/review.html
          grep -q 'truth-checkbox' source-ao/review.html
          grep -q 'catalog-select' source-ao/review.html
          grep -q "let adminToken=''" source-ao/review.js
          grep -q 'const checked=card.querySelector' source-ao/review.js
          grep -q 'if(!itemId||!checked)' source-ao/review.js
          ! grep -Eq 'localStorage|sessionStorage' source-ao/review.js
      - name: Validate public sourcing privacy contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q '/api/sourcing-requests' source-ao/sourcing-ui.js
          grep -q 'requester_contact:contact' source-ao/sourcing-ui.js
          grep -q 'track.html' source-ao/sourcing-ui.js
          ! grep -Eq 'localStorage|sessionStorage' source-ao/sourcing-ui.js
          ! grep -Eq 'console\.(log|info).*privateTrackingUrl|console\.(log|info).*requester_contact' source-ao/sourcing-ui.js
      - name: Validate private tracking contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'noindex,nofollow,noarchive' source-ao/track.html
          grep -q 'no-referrer' source-ao/track.html
          grep -q '/api/sourcing-requests/' source-ao/track.js
          ! grep -Eq 'localStorage|sessionStorage' source-ao/track.js
          ! grep -Eq 'requester_contact|contact_encrypted|contact_hint' source-ao/track.html source-ao/track.js
      - name: Validate Sourcing Desk privacy contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'private contacts' source-ao/requests.html
          grep -q "let adminToken=''" source-ao/requests.js
          grep -q '/api/admin/demand-radar' source-ao/requests.js
          ! grep -Eq 'localStorage|sessionStorage' source-ao/requests.js
          ! grep -Eq 'JSON\.stringify\(requests\)|Blob\(' source-ao/requests.js
          grep -q '/commercial-case' source-ao/requests.js
          grep -q '/cost-options' source-ao/requests.js
          grep -q '/proposal-draft' source-ao/requests.js
          grep -q '/fulfillment' source-ao/requests.js
          grep -q '/api/admin/commercial-dashboard' source-ao/requests.js
          grep -q '/api/admin/commercial-actions' source-ao/requests.js
          grep -q '/collections' source-ao/requests.js
          grep -q '/payments' source-ao/requests.js
          ! grep -Eq 'localStorage|sessionStorage' source-ao/requests.js
      - name: Validate commercial case privacy and truth contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q "CREATE TABLE IF NOT EXISTS sourcing_commercial_cases" source-ao/backend/migrations/0016_commercial_case.sql
          grep -q "CREATE TABLE IF NOT EXISTS sourcing_cost_options" source-ao/backend/migrations/0016_commercial_case.sql
          grep -q "proposal_ready" source-ao/backend/src/commercial-case.js
          grep -q "fx_rate_required" source-ao/backend/src/commercial-case.js
          grep -q "proposal_payment_terms" source-ao/backend/migrations/0017_proposal_pack.sql
          grep -q "buildProposalDraft" source-ao/backend/src/commercial-case.js
          grep -q "/proposal-draft" source-ao/backend/src/router.js
          ! grep -Eq "['\"][^'\"]+@[^'\"]+['\"]|['\"]\\+244[0-9[:space:]]+['\"]" source-ao/backend/migrations/0016_commercial_case.sql source-ao/backend/migrations/0017_proposal_pack.sql
      - name: Validate fulfillment and realized-profit truth contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q "CREATE TABLE IF NOT EXISTS sourcing_fulfillment_cases" source-ao/backend/migrations/0018_fulfillment_profit.sql
          grep -q "realized_profit_ready" source-ao/backend/src/fulfillment.js
          grep -q "accepted_proposal_required" source-ao/backend/src/fulfillment.js
          grep -q "stage_regression_not_allowed" source-ao/backend/src/fulfillment.js
          grep -q "/fulfillment" source-ao/backend/src/router.js
          grep -q "aggregated_only" source-ao/backend/src/commercial-dashboard.js
          grep -q "/api/admin/commercial-dashboard" source-ao/backend/src/router.js
          ! grep -Eq "['\"][^'\"]+@[^'\"]+['\"]|['\"]\\+244[0-9[:space:]]+['\"]" source-ao/backend/migrations/0018_fulfillment_profit.sql
      - name: Validate collections ledger truth contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q "CREATE TABLE IF NOT EXISTS sourcing_invoices" source-ao/backend/migrations/0019_collections.sql
          grep -q "CREATE TABLE IF NOT EXISTS sourcing_payments" source-ao/backend/migrations/0019_collections.sql
          grep -q "payment_reference_exists" source-ao/backend/src/collections.js
          grep -q "void_reason_required" source-ao/backend/src/collections.js
          grep -q "delivery_required" source-ao/backend/src/collections.js
          grep -q "/collections" source-ao/backend/src/router.js
          grep -q "/payments" source-ao/backend/src/router.js
          grep -q "identity_minimized" source-ao/backend/src/commercial-actions.js
          grep -q "collect_overdue" source-ao/backend/src/commercial-actions.js
          grep -q "/api/admin/commercial-actions" source-ao/backend/src/router.js
          ! grep -Eq "['\"][^'\"]+@[^'\"]+['\"]|['\"]\\+244[0-9[:space:]]+['\"]" source-ao/backend/migrations/0019_collections.sql
      - name: Validate legal and evidence baseline
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'name="robots" content="index,follow"' source-ao/index.html
          grep -q 'name="robots" content="index,follow"' source-ao/privacy.html
          grep -q 'name="robots" content="index,follow"' source-ao/terms.html
          grep -q 'does \*\*not\*\* accept or store private screenshots' source-ao/docs/EVIDENCE_POLICY.md
          grep -q '"CONTACT_RETENTION_DAYS": "180"' source-ao/backend/wrangler.jsonc
          grep -q '"head_sampling_rate": 0.1' source-ao/backend/wrangler.jsonc
      - name: Validate opportunity vs material-sourcing market scope
        shell: bash
        run: |
          set -euo pipefail
          grep -q "regional material sourcing only" source-ao/backend/migrations/0013_material_sourcing_scope.sql
          grep -q "country_code='AO'" source-ao/backend/src/index.js
          grep -q "active=1 AND country_code='AO'" source-ao/backend/src/opportunity-pipeline.js
          ! grep -q 'data-market="NA"' source-ao/opportunity-radar.html
          ! grep -q 'data-market="ZA"' source-ao/opportunity-radar.html
          grep -q "material and equipment sourcing market" source-ao/README.md

      - name: Validate confidential sourcing supplier network
        shell: bash
        run: |
          set -euo pipefail
          grep -q "CREATE TABLE IF NOT EXISTS private_sourcing_suppliers" source-ao/backend/migrations/0014_private_sourcing_suppliers.sql
          grep -q "/api/admin/sourcing-suppliers" source-ao/backend/src/router.js
          grep -q "PII_ENCRYPTION_KEY" source-ao/backend/src/private-sourcing-suppliers.js
          grep -q "informal_market_requires_material_verification" source-ao/backend/src/private-sourcing-suppliers.js
          ! grep -RqiE 'private_contact_encrypted[[:space:]]*[:=][[:space:]]*["'\''"][^"'\'']+|internal_notes[[:space:]]*[:=][[:space:]]*["'\''"][^"'\'']+' source-ao/data source-ao/*.html source-ao/*.js

      - name: Validate private commercial partner network
        shell: bash
        run: |
          set -euo pipefail
          grep -q "CREATE TABLE IF NOT EXISTS commercial_partners" source-ao/backend/migrations/0011_commercial_partner_network.sql
          grep -q "/api/admin/partner-network" source-ao/backend/src/router.js
          grep -q "matchCommercialPartners" source-ao/backend/src/intelligence-route.js
          grep -q "HMATIAS commercial partner network" source-ao/ops.html
          grep -q "commercial_priority" source-ao/backend/migrations/0012_partner_followup_pipeline.sql
          ! grep -Eq 'INSERT[[:space:]]+(OR[[:space:]]+IGNORE[[:space:]]+)?INTO[[:space:]]+commercial_partners|UPDATE[[:space:]]+commercial_partners[[:space:]]+SET' source-ao/backend/migrations/0011_commercial_partner_network.sql source-ao/backend/migrations/0012_partner_followup_pipeline.sql
          ! grep -Eq '@|\+244[0-9]' source-ao/backend/migrations/0011_commercial_partner_network.sql source-ao/backend/migrations/0012_partner_followup_pipeline.sql

      - name: Validate backend syntax
        run: |
          node --check source-ao/backend/src/index.js
          node --check source-ao/backend/src/public-search.js
          node --check source-ao/backend/src/router.js
          node --check source-ao/backend/src/intake-alerts.js
          node --check source-ao/backend/src/sourcing.js
          node --check source-ao/backend/src/security.js
          node --check source-ao/backend/src/health.js
          node --check source-ao/backend/src/maintenance.js
          node --check source-ao/backend/src/opportunity-pipeline.js
          node --check source-ao/backend/src/partner-network.js
          node --check source-ao/backend/src/private-sourcing-suppliers.js
          node --check source-ao/backend/src/commercial-case.js
          node --check source-ao/backend/src/fulfillment.js
          node --check source-ao/backend/src/commercial-dashboard.js
          node --check source-ao/backend/src/collections.js
          node --check source-ao/backend/src/commercial-actions.js
          node --check source-ao/backend/src/intelligence.js
          node --check source-ao/backend/src/intelligence-route.js
      - name: Validate staging scripts syntax
        run: |
          node --check source-ao/backend/scripts/smoke-staging.mjs
          node --check source-ao/backend/scripts/pilot-staging.mjs
          node --check source-ao/backend/scripts/prepare-staging-config.mjs
          node --check source-ao/backend/scripts/build-staging-web.mjs
          node --check source-ao/backend/scripts/smoke-staging-web.mjs
      - name: Build staging public allowlist
        working-directory: source-ao/backend
        env:
          SOURCE_AO_API_BASE: https://api-staging.example.test
          SOURCE_AO_STAGING_PUBLIC_ORIGIN: https://staging.example.test
        run: |
          node scripts/build-staging-web.mjs
          test -f .staging-web/index.html
          test -f .staging-web/favicon.svg
          test -f .staging-web/confirm.html
          test -f .staging-web/track.html
          test -f .staging-web/privacy.html
          test -f .staging-web/privacy-en.html
          test -f .staging-web/terms.html
          test -f .staging-web/terms-en.html
          test -f .staging-web/partner-application.html
          test -f .staging-web/partner-application-en.html
          test -f .staging-web/partner-application.js
          test -f .staging-web/data/catalog.json
          test -f .staging-web/rfq.html
          test -f .staging-web/rfq-model.js
          test ! -e .staging-web/backend
          test ! -e .staging-web/docs
          test ! -e .staging-web/verification-desk.html
          test ! -e .staging-web/review-desk.html
          test ! -e .staging-web/sourcing-desk.html
          grep -q 'api-staging.example.test' .staging-web/runtime-config.js
          grep -q 'Disallow: /' .staging-web/robots.txt
          grep -q 'noindex,nofollow,noarchive' .staging-web/index.html
          grep -q 'noindex,nofollow,noarchive' .staging-web/privacy.html
          grep -q 'noindex,nofollow,noarchive' .staging-web/terms.html
          grep -q 'noindex,nofollow,noarchive' .staging-web/privacy-en.html
          grep -q 'noindex,nofollow,noarchive' .staging-web/terms-en.html
          grep -q 'noindex,nofollow,noarchive' .staging-web/partner-application-en.html
          rm -rf .staging-web wrangler.web.staging.runtime.jsonc
      - name: Validate staging deploy remains manual-only
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'workflow_dispatch:' .github/workflows/source-ao-staging-deploy.yml
          ! grep -Eq '^  (push|pull_request|schedule):' .github/workflows/source-ao-staging-deploy.yml
          grep -q "inputs.confirm == 'DEPLOY-STAGING'" .github/workflows/source-ao-staging-deploy.yml
          grep -q 'Verify existing Cloudflare Worker secrets' .github/workflows/source-ao-staging-deploy.yml
          grep -q "PII_ENCRYPTION_KEY" .github/workflows/source-ao-staging-deploy.yml
          grep -q "RATE_LIMIT_SECRET" .github/workflows/source-ao-staging-deploy.yml
          grep -q 'Prove private D1 export path' .github/workflows/source-ao-staging-deploy.yml
          grep -q 'Deploy isolated staging frontend' .github/workflows/source-ao-staging-deploy.yml
          grep -q 'Record active staging Worker versions' .github/workflows/source-ao-staging-deploy.yml
          grep -q 'Rehearse staging rollback and restore reviewed release' .github/workflows/source-ao-staging-deploy.yml
          grep -q 'ROLLBACK_REHEARSAL=PASS' .github/workflows/source-ao-staging-deploy.yml
      - name: Validate backend package manifest
        run: |
          node -e "JSON.parse(require('fs').readFileSync('source-ao/backend/package.json','utf8')); console.log('package manifest PASS')"
      - name: Run backend trust tests
        run: node --test source-ao/backend/test/*.test.mjs
