name: Source AO Data Quality

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'source-ao/data/**'
      - 'source-ao/schemas/**'
      - 'source-ao/backend/**'
      - 'source-ao/docs/**'
      - 'source-ao/*.js'
      - 'source-ao/*.html'
      - 'source-ao/*.css'
      - 'source-ao/data-contract.json'
      - 'source-ao/validate-data.mjs'
      - '.github/workflows/source-ao-staging-deploy.yml'
  push:
    branches:
      - source-ao-v1
    paths:
      - 'source-ao/data/**'
      - 'source-ao/schemas/**'
      - 'source-ao/backend/**'
      - 'source-ao/docs/**'
      - 'source-ao/*.js'
      - 'source-ao/*.html'
      - 'source-ao/*.css'
      - 'source-ao/data-contract.json'
      - 'source-ao/validate-data.mjs'
      - '.github/workflows/source-ao-staging-deploy.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Source AO data
        run: node source-ao/validate-data.mjs
      - name: Validate frontend scripts syntax
        run: |
          node --check source-ao/data-engine.js
          node --check source-ao/sourceao.js
          node --check source-ao/verified-results.js
          node --check source-ao/runtime-config.js
          node --check source-ao/api-client.js
          node --check source-ao/ops.js
          node --check source-ao/confirm.js
          node --check source-ao/review.js
          node --check source-ao/sourcing-ui.js
          node --check source-ao/track.js
          node --check source-ao/requests.js
      - name: Validate Ops Desk security contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'type="password"' source-ao/ops.html
          grep -q 'runtime-config.js' source-ao/ops.html
          grep -q "let adminToken=''" source-ao/ops.js
          grep -q 'confirmation_url:discardedConfirmationUrl' source-ao/ops.js
          ! grep -Eq 'localStorage\.(setItem|getItem)\([^)]*adminToken|sessionStorage\.(setItem|getItem)\([^)]*adminToken' source-ao/ops.js
      - name: Validate Review Desk approval gate
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'noindex,nofollow,noarchive' source-ao/review.html
          grep -q 'no-referrer' source-ao/review.html
          grep -q 'truth-checkbox' source-ao/review.html
          grep -q 'catalog-select' source-ao/review.html
          grep -q "let adminToken=''" source-ao/review.js
          grep -q 'const checked=card.querySelector' source-ao/review.js
          grep -q 'if(!itemId||!checked)' source-ao/review.js
          ! grep -Eq 'localStorage|sessionStorage' source-ao/review.js
      - name: Validate public sourcing privacy contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q '/api/sourcing-requests' source-ao/sourcing-ui.js
          grep -q 'requester_contact:contact' source-ao/sourcing-ui.js
          grep -q 'track.html' source-ao/sourcing-ui.js
          ! grep -Eq 'localStorage|sessionStorage' source-ao/sourcing-ui.js
          ! grep -Eq 'console\.(log|info).*privateTrackingUrl|console\.(log|info).*requester_contact' source-ao/sourcing-ui.js
      - name: Validate private tracking contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'noindex,nofollow,noarchive' source-ao/track.html
          grep -q 'no-referrer' source-ao/track.html
          grep -q '/api/sourcing-requests/' source-ao/track.js
          ! grep -Eq 'localStorage|sessionStorage' source-ao/track.js
          ! grep -Eq 'requester_contact|contact_encrypted|contact_hint' source-ao/track.html source-ao/track.js
      - name: Validate Sourcing Desk privacy contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'private contacts' source-ao/requests.html
          grep -q "let adminToken=''" source-ao/requests.js
          grep -q '/api/admin/demand-radar' source-ao/requests.js
          ! grep -Eq 'localStorage|sessionStorage' source-ao/requests.js
          ! grep -Eq 'JSON\.stringify\(requests\)|Blob\(' source-ao/requests.js
      - name: Validate legal and evidence baseline
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'name="robots" content="index,follow"' source-ao/index.html
          grep -q 'name="robots" content="index,follow"' source-ao/privacy.html
          grep -q 'name="robots" content="index,follow"' source-ao/terms.html
          grep -q 'does \*\*not\*\* accept or store private screenshots' source-ao/docs/EVIDENCE_POLICY.md
          grep -q '"CONTACT_RETENTION_DAYS": "180"' source-ao/backend/wrangler.jsonc
          grep -q '"head_sampling_rate": 0.1' source-ao/backend/wrangler.jsonc
      - name: Validate backend syntax
        run: |
          node --check source-ao/backend/src/index.js
          node --check source-ao/backend/src/public-search.js
          node --check source-ao/backend/src/router.js
          node --check source-ao/backend/src/sourcing.js
          node --check source-ao/backend/src/security.js
          node --check source-ao/backend/src/health.js
          node --check source-ao/backend/src/maintenance.js
      - name: Validate staging scripts syntax
        run: |
          node --check source-ao/backend/scripts/smoke-staging.mjs
          node --check source-ao/backend/scripts/pilot-staging.mjs
          node --check source-ao/backend/scripts/prepare-staging-config.mjs
          node --check source-ao/backend/scripts/build-staging-web.mjs
          node --check source-ao/backend/scripts/smoke-staging-web.mjs
      - name: Build staging public allowlist
        working-directory: source-ao/backend
        env:
          SOURCE_AO_API_BASE: https://api-staging.example.test
          SOURCE_AO_STAGING_PUBLIC_ORIGIN: https://staging.example.test
        run: |
          node scripts/build-staging-web.mjs
          test -f .staging-web/index.html
          test -f .staging-web/confirm.html
          test -f .staging-web/track.html
          test -f .staging-web/privacy.html
          test -f .staging-web/terms.html
          test -f .staging-web/data/catalog.json
          test ! -e .staging-web/backend
          test ! -e .staging-web/docs
          test ! -e .staging-web/verification-desk.html
          test ! -e .staging-web/review-desk.html
          test ! -e .staging-web/sourcing-desk.html
          grep -q 'api-staging.example.test' .staging-web/runtime-config.js
          grep -q 'Disallow: /' .staging-web/robots.txt
          grep -q 'noindex,nofollow,noarchive' .staging-web/index.html
          grep -q 'noindex,nofollow,noarchive' .staging-web/privacy.html
          grep -q 'noindex,nofollow,noarchive' .staging-web/terms.html
          rm -rf .staging-web wrangler.web.staging.runtime.jsonc
      - name: Validate staging deploy remains manual-only
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'workflow_dispatch:' .github/workflows/source-ao-staging-deploy.yml
          ! grep -Eq '^  (push|pull_request|schedule):' .github/workflows/source-ao-staging-deploy.yml
          grep -q "inputs.confirm == 'DEPLOY-STAGING'" .github/workflows/source-ao-staging-deploy.yml
          grep -q 'SOURCE_AO_STAGING_PII_ENCRYPTION_KEY' .github/workflows/source-ao-staging-deploy.yml
          grep -q 'SOURCE_AO_STAGING_RATE_LIMIT_SECRET' .github/workflows/source-ao-staging-deploy.yml
          grep -q 'Prove private D1 export path' .github/workflows/source-ao-staging-deploy.yml
          grep -q 'Deploy isolated staging frontend' .github/workflows/source-ao-staging-deploy.yml
      - name: Validate backend package manifest
        run: |
          node -e "JSON.parse(require('fs').readFileSync('source-ao/backend/package.json','utf8')); console.log('package manifest PASS')"
      - name: Run backend trust tests
        run: node --test source-ao/backend/test/*.test.mjs
