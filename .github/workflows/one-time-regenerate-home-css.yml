name: One-time regenerate homepage CSS bundles

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned CSS build tooling
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Regenerate and validate generated CSS
        run: |
          node scripts/build-home-css.mjs --write
          node scripts/check-commercial-audit.mjs
      - name: Commit generated CSS bundles
        shell: bash
        run: |
          if git diff --quiet -- home-base.css home-details.css clean-base.css clean-details.css; then
            echo "Generated CSS bundles already match their source stylesheets."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home-base.css home-details.css clean-base.css clean-details.css
          git commit -m "Regenerate homepage CSS bundles from source"
          git push origin HEAD:main
