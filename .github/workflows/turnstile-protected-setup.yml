name: HMATIAS Turnstile Protected Setup
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hmatias-turnstile-protected-setup
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: source-ao-staging
    defaults:
      run:
        working-directory: source-ao/backend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_TURNSTILE_API_TOKEN: ${{ secrets.CLOUDFLARE_TURNSTILE_API_TOKEN }}
      SOURCE_AO_RESEND_API_KEY: ${{ secrets.SOURCE_AO_RESEND_API_KEY }}
      SOURCE_AO_ALERT_FROM: ${{ vars.SOURCE_AO_ALERT_FROM || 'HMATIAS Source AO <geral@comercialhmatiasps.com>' }}
      SOURCE_AO_ALERT_TO: ${{ vars.SOURCE_AO_ALERT_TO || 'geral@comercialhmatiasps.com' }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install Wrangler
        run: npm install --no-audit --no-fund
      - name: Check protected setup script syntax
        run: node --check scripts/setup-website-turnstile.mjs
      - name: Create or reuse Turnstile and install protected Worker bindings
        run: node scripts/setup-website-turnstile.mjs
      - name: Verify that public lead intake remains disabled
        run: |
          node --input-type=module <<'NODE'
          const res=await fetch('https://source-ao-api.matias500-mhf.workers.dev/api/website-leads/config',{
            headers:{origin:'https://comercialhmatiasps.com'},
            signal:AbortSignal.timeout(15000)
          });
          if(!res.ok)throw Error('Website lead configuration endpoint unavailable');
          const payload=await res.json();
          if(payload.enabled!==false)throw Error('Website lead intake was enabled unexpectedly');
          console.log('PASS: lead intake remains disabled; no customer data was submitted.');
          NODE
      - name: Remove protected temporary config
        if: always()
        run: rm -f wrangler.production.runtime.jsonc
