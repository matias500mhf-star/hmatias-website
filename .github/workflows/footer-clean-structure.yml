name: Complete HMATIAS Clean footer legal links

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  organize-clean-footer:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Complete Clean footer legal section
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'hmatias-clean.html': (
                  '<div><strong>Contacto</strong><a href="mailto:comercial@hmatiasps.ao">comercial@hmatiasps.ao</a><a href="https://wa.me/244948806673" target="_blank" rel="noopener">WhatsApp</a><a href="privacidade.html">Privacidade</a></div>',
                  '<div><strong>Contacto</strong><a href="mailto:comercial@hmatiasps.ao">comercial@hmatiasps.ao</a><a href="https://wa.me/244948806673" target="_blank" rel="noopener">WhatsApp</a><strong>Legal</strong><a href="privacidade.html">Política de Privacidade</a><a href="termos.html">Termos & Condições</a></div>'
              ),
              'hmatias-clean-en.html': (
                  '<div><strong>Contact</strong><a href="mailto:comercial@hmatiasps.ao">comercial@hmatiasps.ao</a><a href="https://wa.me/244948806673" target="_blank" rel="noopener">WhatsApp</a><a href="privacy.html">Privacy</a></div>',
                  '<div><strong>Contact</strong><a href="mailto:comercial@hmatiasps.ao">comercial@hmatiasps.ao</a><a href="https://wa.me/244948806673" target="_blank" rel="noopener">WhatsApp</a><strong>Legal</strong><a href="privacy.html">Privacy Policy</a><a href="terms.html">Terms & Conditions</a></div>'
              ),
          }

          changed = []
          for name, (old, new) in replacements.items():
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              ns = s.replace(old, new)
              if ns != s:
                  p.write_text(ns, encoding='utf-8')
                  changed.append(name)

          print('Updated:', ', '.join(changed) if changed else 'none')
          PY
      - name: Commit Clean footer update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hmatias-clean.html hmatias-clean-en.html
          if git diff --cached --quiet; then
            echo 'No changes needed'
          else
            git commit -m 'fix(footer): complete legal links on HMATIAS Clean'
            git push
          fi
