name: HMATIAS Preview Screenshots

on:
  push:
    branches: ["preview-premium-cleanup-v2"]

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Start local site
        shell: bash
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/hmatias-preview.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/hmatias-preview.log
          exit 1
      - name: Capture PT and EN previews
        shell: bash
        run: |
          npm install playwright --no-save
          CHROME=$(which google-chrome || which chromium || which chromium-browser)
          export CHROME
          mkdir -p preview-shots
          node <<'JS'
          const { chromium } = require('playwright');
          const path = require('path');
          (async () => {
            const browser = await chromium.launch({headless:true, executablePath: process.env.CHROME, args:['--no-sandbox']});
            const cases = [
              ['pt-desktop','http://127.0.0.1:8080/',{width:1440,height:1000}],
              ['pt-mobile','http://127.0.0.1:8080/',{width:390,height:844}],
              ['en-desktop','http://127.0.0.1:8080/en.html',{width:1440,height:1000}],
              ['en-mobile','http://127.0.0.1:8080/en.html',{width:390,height:844}],
            ];
            for (const [name,url,viewport] of cases) {
              const page = await browser.newPage({viewport});
              await page.goto(url,{waitUntil:'networkidle'});
              await page.screenshot({path:path.join('preview-shots',name+'.png'),fullPage:true});
              await page.close();
            }
            await browser.close();
          })();
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: hmatias-premium-cleanup-preview
          path: preview-shots/*.png
          retention-days: 3
