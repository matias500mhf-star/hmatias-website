name: Optimize HMATIAS hero image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Convert hero PNG to WebP
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          src = Path('projeto-07.png')
          out = Path('projeto-07.webp')
          im = Image.open(src).convert('RGB')
          im.save(out, 'WEBP', quality=88, method=6)
          print(f'{src.stat().st_size} -> {out.stat().st_size} bytes')
          PY
      - name: Use WebP in the critical hero path
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<link rel="preload" as="image" href="projeto-07.png" type="image/png">', '<link rel="preload" as="image" href="projeto-07.webp" type="image/webp">')
          s = s.replace('<picture class="hero-photo"><img src="projeto-07.png" alt="Projeto e trabalho real da HMATIAS" width="2048" height="1536" fetchpriority="high" decoding="async"></picture>', '<picture class="hero-photo"><source srcset="projeto-07.webp" type="image/webp"><img src="projeto-07.png" alt="Projeto e trabalho real da HMATIAS" width="1086" height="1448" fetchpriority="high" decoding="async"></picture>')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit optimized asset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projeto-07.webp index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'perf: optimize hero image to WebP'
            git push
          fi
