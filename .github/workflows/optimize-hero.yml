name: Final HMATIAS site hardening

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tooling
        run: python -m pip install --quiet pillow

      - name: Optimize public image assets and create social card
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont, ImageOps

          def optimize(src_name, out_name, max_size, quality):
              src=Path(src_name); out=Path(out_name)
              im=ImageOps.exif_transpose(Image.open(src)).convert('RGB')
              im.thumbnail(max_size, Image.Resampling.LANCZOS)
              im.save(out,'WEBP',quality=quality,method=6)
              print(f'{src_name}: {src.stat().st_size} -> {out.stat().st_size} bytes; {im.size}')

          optimize('projeto-07.png','projeto-07.webp',(720,1080),78)
          optimize('projeto-04.jpg','projeto-04.webp',(720,720),76)
          optimize('projeto-01.jpg','projeto-01.webp',(960,720),78)
          optimize('projeto-03.jpg','projeto-03.webp',(960,720),78)
          optimize('logo-hmatias.png','logo-hmatias.webp',(320,320),82)

          # Social preview: built from a real HMATIAS project photo and the official logo.
          bg=ImageOps.exif_transpose(Image.open('projeto-01.jpg')).convert('RGB')
          target=(1200,630)
          scale=max(target[0]/bg.width,target[1]/bg.height)
          bg=bg.resize((round(bg.width*scale),round(bg.height*scale)),Image.Resampling.LANCZOS)
          left=(bg.width-target[0])//2; top=(bg.height-target[1])//2
          bg=bg.crop((left,top,left+target[0],top+target[1])).convert('RGBA')
          overlay=Image.new('RGBA',target,(6,45,86,178))
          card=Image.alpha_composite(bg,overlay)
          draw=ImageDraw.Draw(card)
          font_dir=Path('/usr/share/fonts/truetype/dejavu')
          def font(name,size):
              p=font_dir/name
              return ImageFont.truetype(str(p),size) if p.exists() else ImageFont.load_default()
          title_font=font('DejaVuSans-Bold.ttf',78)
          sub_font=font('DejaVuSans-Bold.ttf',34)
          small_font=font('DejaVuSans.ttf',24)

          logo=Image.open('logo-hmatias.png').convert('RGBA')
          logo.thumbnail((180,180),Image.Resampling.LANCZOS)
          card.alpha_composite(logo,(70,55))
          draw.text((70,270),'HMATIAS',font=title_font,fill='white')
          draw.text((70,372),'CONSTRUÇÃO · FACILITIES · SUPPLY',font=sub_font,fill=(213,238,255,255))
          draw.text((70,455),'Luanda · Angola',font=small_font,fill='white')
          draw.text((70,505),'comercialhmatiasps.com',font=small_font,fill='white')
          card.convert('RGB').save('og-hmatias.jpg','JPEG',quality=86,optimize=True,progressive=True)
          print('og-hmatias.jpg:',Path('og-hmatias.jpg').stat().st_size,'bytes')
          PY

      - name: Finalize SEO and accessibility markup
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def set_meta(s, key, value, prop=False):
              attr='property' if prop else 'name'
              pat=rf'(<meta {attr}="{re.escape(key)}" content=")[^"]*(">)'
              s,n=re.subn(pat,lambda m:m.group(1)+value+m.group(2),s,count=1)
              if n!=1:
                  raise RuntimeError(f'Missing meta {attr}={key}')
              return s

          def set_title(s, value):
              s,n=re.subn(r'<title>.*?</title>',f'<title>{value}</title>',s,count=1,flags=re.S)
              if n!=1: raise RuntimeError('Missing title')
              return s

          def social_image(s, alt):
              s=re.sub(r'\n\s*<meta property="og:image:(?:width|height|alt)"[^>]*>','',s)
              s=re.sub(r'\n\s*<meta name="twitter:image:alt"[^>]*>','',s)
              block=(f'<meta property="og:image" content="https://comercialhmatiasps.com/og-hmatias.jpg">\n'
                     f'  <meta property="og:image:width" content="1200">\n'
                     f'  <meta property="og:image:height" content="630">\n'
                     f'  <meta property="og:image:alt" content="{alt}">')
              s,n=re.subn(r'<meta property="og:image" content="[^"]+">',block,s,count=1)
              if n!=1: raise RuntimeError('Missing og:image')
              s,n=re.subn(r'<meta name="twitter:image" content="[^"]+">',
                           f'<meta name="twitter:image" content="https://comercialhmatiasps.com/og-hmatias.jpg">\n  <meta name="twitter:image:alt" content="{alt}">',s,count=1)
              if n!=1: raise RuntimeError('Missing twitter:image')
              return s

          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          title='HMATIAS | Construção Civil, Facilities &amp; Supply em Luanda'
          desc='Construção civil, facilities, manutenção e procurement para empresas em Angola. Soluções HMATIAS com execução, fornecimento e apoio operacional.'
          s=set_title(s,title)
          s=set_meta(s,'description',desc)
          s=set_meta(s,'og:title',title,True)
          s=set_meta(s,'og:description',desc,True)
          s=set_meta(s,'twitter:title',title)
          s=set_meta(s,'twitter:description',desc)
          s=social_image(s,'HMATIAS — Construção, Facilities e Supply em Luanda')
          s=s.replace('script.js?v=3','script.js?v=4')
          p.write_text(s,encoding='utf-8')

          p=Path('en.html'); s=p.read_text(encoding='utf-8')
          title='HMATIAS | Construction, Facilities &amp; Supply in Luanda'
          desc='Civil construction, facilities, maintenance and procurement for businesses in Angola. HMATIAS delivers execution, supply and operational support.'
          s=set_title(s,title)
          s=set_meta(s,'description',desc)
          s=set_meta(s,'og:title',title,True)
          s=set_meta(s,'og:description',desc,True)
          s=set_meta(s,'twitter:title',title)
          s=set_meta(s,'twitter:description',desc)
          s=social_image(s,'HMATIAS — Construction, Facilities and Supply in Luanda')
          s=s.replace('script.js?v=3','script.js?v=4')
          p.write_text(s,encoding='utf-8')

          social_pages={
              'construcao.html':'HMATIAS — Construção Civil e Infraestrutura em Luanda',
              'construction.html':'HMATIAS — Civil Construction and Infrastructure in Luanda',
              'facilities.html':'HMATIAS — Facilities Services e Manutenção em Luanda',
              'facilities-en.html':'HMATIAS — Facilities Services and Maintenance in Luanda',
              'supply.html':'HMATIAS — Procurement e Fornecimento Empresarial em Angola',
              'supply-en.html':'HMATIAS — Procurement and Business Supply in Angola',
          }
          for name,alt in social_pages.items():
              p=Path(name); s=p.read_text(encoding='utf-8')
              s=social_image(s,alt)
              s=s.replace('script.js?v=3','script.js?v=4')
              if name=='supply.html':
                  t='Procurement &amp; Fornecimento Empresarial em Angola | HMATIAS'
                  s=set_title(s,t); s=set_meta(s,'og:title',t,True); s=set_meta(s,'twitter:title',t)
              elif name=='supply-en.html':
                  t='Procurement &amp; Business Supply in Angola | HMATIAS'
                  s=set_title(s,t); s=set_meta(s,'og:title',t,True); s=set_meta(s,'twitter:title',t)
              p.write_text(s,encoding='utf-8')

          for p in Path('.').glob('*.html'):
              s=p.read_text(encoding='utf-8')
              ns=s.replace('script.js?v=3','script.js?v=4')
              if ns!=s: p.write_text(ns,encoding='utf-8')

          css=Path('style.css')
          s=css.read_text(encoding='utf-8')
          marker='/* HMATIAS FINAL A11Y HARDENING 2026-09-10 */'
          if marker not in s:
              s += '''\n\n/* HMATIAS FINAL A11Y HARDENING 2026-09-10 */\n.service-card > a,.division-card > a{display:inline-flex;align-items:center;min-height:44px;padding-block:10px}\n@media(max-width:850px){.nav-menu a{display:flex;align-items:center;min-height:44px}}\n@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto!important}*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}\n'''
              css.write_text(s,encoding='utf-8')
          PY

      - name: Commit final hardened assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add projeto-01.webp projeto-03.webp projeto-04.webp projeto-07.webp logo-hmatias.webp og-hmatias.jpg style.css *.html
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'perf(seo): finalize site metadata, social preview, images and accessibility'
            git push
          fi
