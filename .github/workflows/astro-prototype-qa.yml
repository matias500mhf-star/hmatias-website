name: Astro prototype QA

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "platform/astro-preview/**"
      - "source-ao/data/catalog.json"
      - "source-ao/data/public-catalog.json"
      - "source-ao/opportunity-radar.js"
      - "source-ao/opportunity-radar.css"
      - "source-ao/api-client.js"
      - "source-ao/data-engine.js"
      - "source-ao/rfq.js"
      - "source-ao/rfq-model.js"
      - "platform/astro-preview/scripts/generate-public-catalog.mjs"
      - ".github/workflows/astro-prototype-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astro-prototype-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/astro-preview
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js from project pin
        uses: actions/setup-node@v4
        with:
          node-version-file: platform/astro-preview/.node-version

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Check dependency security
        run: npm audit --audit-level=high

      - name: Type-check Astro and TypeScript
        run: npm run check

      - name: Build static website
        run: npm run build

      - name: Verify generated website
        run: npm run verify

      - name: Verify Source AO RFQ contract and persistence
        run: |
          node --check ../../source-ao/rfq.js
          node --test ../../source-ao/backend/test/rfq.test.mjs

      - name: Install pinned browser QA tools
        run: npm install --no-save --no-package-lock @playwright/test@1.65.0 @axe-core/playwright@4.14.0 @lhci/cli@0.16.0

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium webkit

      - name: Run desktop, mobile and axe accessibility tests
        run: npx playwright test

      - name: Run Lighthouse CI audits
        run: npx lhci autorun --config=./lighthouserc.cjs

      - name: Upload static preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: hmatias-astro-preview
          path: platform/astro-preview/dist/
          if-no-files-found: error
          retention-days: 7
      - name: Upload browser and Lighthouse QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hmatias-browser-quality-reports
          path: |
            platform/astro-preview/playwright-report/
            platform/astro-preview/.lighthouseci/
          if-no-files-found: ignore
          retention-days: 14
          include-hidden-files: true
      - name: Upload generated dependency lockfile
        uses: actions/upload-artifact@v4
        with:
          name: hmatias-astro-lockfile
          path: platform/astro-preview/package-lock.json
          if-no-files-found: error
          retention-days: 7
