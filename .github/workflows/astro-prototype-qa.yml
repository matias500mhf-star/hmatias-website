name: Astro prototype QA

on:
  push:
    branches:
      - feat/hmatias-platform-modernization-20261111
    paths:
      - "platform/astro-preview/**"
      - ".github/workflows/astro-prototype-qa.yml"
  pull_request:
    paths:
      - "platform/astro-preview/**"
      - ".github/workflows/astro-prototype-qa.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: astro-prototype-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/astro-preview
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js from project pin
        uses: actions/setup-node@v4
        with:
          node-version-file: platform/astro-preview/.node-version

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Check dependency security
        run: npm audit --audit-level=high

      - name: Type-check Astro and TypeScript
        run: npm run check

      - name: Build static website
        run: npm run build

      - name: Verify generated website
        run: npm run verify

      - name: Commit generated lockfile to isolated branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/hmatias-platform-modernization-20261111'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Dependency lockfile already committed."
          else
            git commit -m "chore: lock Astro prototype dependencies"
            git push origin HEAD:feat/hmatias-platform-modernization-20261111
          fi

      - name: Upload static preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: hmatias-astro-preview
          path: platform/astro-preview/dist/
          if-no-files-found: error
          retention-days: 7
      - name: Upload generated dependency lockfile
        uses: actions/upload-artifact@v4
        with:
          name: hmatias-astro-lockfile
          path: platform/astro-preview/package-lock.json
          if-no-files-found: error
          retention-days: 7
