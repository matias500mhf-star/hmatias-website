name: Astro prototype QA

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "platform/astro-preview/**"
      - "source-ao/data/catalog.json"
      - "source-ao/data/public-catalog.json"
      - "source-ao/data/public-catalog-privacy.mjs"
      - "source-ao/backend/src/catalog.js"
      - "source-ao/backend/test/catalog.test.mjs"
      - "source-ao/backend/test/public-catalog-generation.test.mjs"
      - "source-ao/opportunity-radar.js"
      - "source-ao/opportunity-radar.css"
      - "source-ao/api-client.js"
      - "source-ao/astro-search.js"
      - "source-ao/data-engine.js"
      - "source-ao/rfq.js"
      - "source-ao/rfq-model.js"
      - "platform/astro-preview/scripts/generate-public-catalog.mjs"
      - ".github/workflows/astro-prototype-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: astro-prototype-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    # Use the stable Cloudflare Pages branch-preview hostname for canonical/hreflang checks.
    env:
      ASTRO_PREVIEW_SITE_URL: https://pr-316.hmatias-pr316-preview.pages.dev
    defaults:
      run:
        working-directory: platform/astro-preview
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js from project pin
        uses: actions/setup-node@v4
        with:
          node-version-file: platform/astro-preview/.node-version

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Type-check Astro and TypeScript
        run: npm run check

      - name: Build static website
        run: npm run build

      - name: Verify generated website
        run: npm run verify

      - name: Verify Source AO RFQ contract and persistence
        run: |
          node --check ../../source-ao/rfq.js
          node --test ../../source-ao/backend/test/rfq.test.mjs
          node --test ../../source-ao/backend/test/catalog.test.mjs
          node --test ../../source-ao/backend/test/public-catalog-generation.test.mjs

      - name: Install pinned browser QA tools
        run: npm install --no-save --no-package-lock @playwright/test@1.65.0 @axe-core/playwright@4.14.0 @lhci/cli@0.16.0

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium webkit

      - name: Run desktop, mobile and axe accessibility tests
        run: npx playwright test

      - name: Run Lighthouse CI audits
        run: npx lhci autorun --config=./lighthouserc.cjs

      - name: Upload static preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: hmatias-astro-preview
          path: platform/astro-preview/dist/
          if-no-files-found: error
          retention-days: 7
      - name: Upload browser and Lighthouse QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hmatias-browser-quality-reports
          path: |
            platform/astro-preview/playwright-report/
            platform/astro-preview/.lighthouseci/
          if-no-files-found: ignore
          retention-days: 14
          include-hidden-files: true
      - name: Upload generated dependency lockfile
        uses: actions/upload-artifact@v4
        with:
          name: hmatias-astro-lockfile
          path: platform/astro-preview/package-lock.json
          if-no-files-found: error
          retention-days: 7

      # Keep the security gate, but run it after build and QA so reports are still produced.
      # Current blocker: GHSA-fc5q-39xc-vjpf affects picomatch 2.3.2/4.0.7; no patched
      # npm release is currently published. This step remains a hard failure until resolved.
      - name: Check dependency security
        if: always()
        run: npm audit --audit-level=high

  deploy-cloudflare-pages-preview:
    name: Deploy isolated Cloudflare Pages preview
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 316
    needs: build-and-verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: source-ao-staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID || '080c9eefe0c4dd70619fa213756e69ca' }}
      CF_PAGES_PROJECT: hmatias-pr316-preview
      CF_PAGES_BRANCH: pr-316
    steps:
      - name: Check Cloudflare credentials
        id: credentials
        shell: bash
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare Pages deploy skipped. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to repository Actions secrets (or account ID as a variable)."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure isolated Pages project exists
        if: steps.credentials.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects"
          status="$(curl --silent --show-error --output "$RUNNER_TEMP/pages-project.json" --write-out '%{http_code}' \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/$CF_PAGES_PROJECT")"
          if [ "$status" = "200" ]; then
            echo "Cloudflare Pages preview project already exists."
          elif [ "$status" = "404" ]; then
            status="$(curl --silent --show-error --output "$RUNNER_TEMP/pages-create.json" --write-out '%{http_code}' \
              --request POST "$api" \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              --header "Content-Type: application/json" \
              --data "{\"name\":\"$CF_PAGES_PROJECT\",\"production_branch\":\"main\"}")"
            [ "$status" = "200" ] || { cat "$RUNNER_TEMP/pages-create.json"; echo "::error::Could not create isolated Cloudflare Pages project (HTTP $status)."; exit 1; }
          else
            cat "$RUNNER_TEMP/pages-project.json"
            echo "::error::Could not inspect Cloudflare Pages project (HTTP $status)."
            exit 1
          fi

      - name: Download verified static site artifact
        if: steps.credentials.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: hmatias-astro-preview
          path: ./cloudflare-pages-dist

      - name: Publish Pull Request preview
        if: steps.credentials.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy ./cloudflare-pages-dist --project-name=hmatias-pr316-preview --branch=pr-316
