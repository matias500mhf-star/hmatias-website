name: HMATIAS Pages Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  integrity:
    uses: ./.github/workflows/site-integrity.yml

  quality:
    uses: ./.github/workflows/site-quality.yml

  deploy:
    needs: [integrity, quality]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build public-only site artifact
        shell: bash
        run: |
          set -euo pipefail
          out=".public-site"
          rm -rf "$out"
          mkdir -p "$out"
          rsync -a ./ "$out"/ \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.public-site/' \
            --exclude '.source-ao-production-release' \
            --exclude 'SECURITY.md' \
            --exclude 'source-ao/backend/' \
            --exclude 'lead-intake/' \
            --exclude 'source-ao/data/' \
            --exclude 'source-ao/docs/' \
            --exclude 'source-ao/schemas/' \
            --exclude 'source-ao/data-contract.json' \
            --exclude 'source-ao/validate-data.mjs' \
            --exclude 'source-ao/ops.html' \
            --exclude 'source-ao/ops.js' \
            --exclude 'source-ao/ops.css' \
            --exclude 'source-ao/review.html' \
            --exclude 'source-ao/review.js' \
            --exclude 'source-ao/review.css' \
            --exclude 'source-ao/requests.html' \
            --exclude 'source-ao/requests.js' \
            --exclude 'source-ao/requests.css' \
            --exclude 'source-ao/supplier-discovery.html' \
            --exclude 'source-ao/supplier-discovery.js' \
            --exclude 'source-ao/website-leads.html' \
            --exclude 'source-ao/website-leads-ops.js'
          node source-ao/backend/scripts/public-data.mjs "$out/source-ao/data"
          test -f "$out/source-ao/data/catalog.json"
          test ! -e "$out/source-ao/data/suppliers.json"
          test ! -e "$out/source-ao/data/services.json"
          test ! -e "$out/source-ao/data/observations.json"
          test ! -e "$out/source-ao/data/verification-queue.json"
          test -f "$out/index.html"
          test -f "$out/source-ao/index.html"
          test ! -e "$out/source-ao/backend"
          test ! -e "$out/lead-intake"
          test ! -e "$out/source-ao/docs"
          test ! -e "$out/source-ao/ops.html"
          test ! -e "$out/source-ao/ops.js"
          test ! -e "$out/source-ao/ops.css"
          test ! -e "$out/source-ao/review.html"
          test ! -e "$out/source-ao/review.js"
          test ! -e "$out/source-ao/review.css"
          test ! -e "$out/source-ao/requests.html"
          test ! -e "$out/source-ao/requests.js"
          test ! -e "$out/source-ao/requests.css"
          test ! -e "$out/source-ao/supplier-discovery.html"
          test ! -e "$out/source-ao/supplier-discovery.js"
          test ! -e "$out/source-ao/website-leads.html"
          test ! -e "$out/source-ao/website-leads-ops.js"
          test ! -e "$out/.github"
          echo "Public-only deployment artifact prepared."

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .public-site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  production-smoke-test:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify critical production URLs
        shell: bash
        run: |
          set -euo pipefail
          base="https://comercialhmatiasps.com"

          fetch() {
            local path="$1"
            local out="$2"
            curl --fail --silent --show-error --location \
              --retry 6 --retry-delay 10 --retry-all-errors \
              --connect-timeout 15 --max-time 45 \
              "$base$path" -o "$out"
          }

          fetch "/" /tmp/home.html
          fetch "/en.html" /tmp/en.html
          fetch "/robots.txt" /tmp/robots.txt
          fetch "/sitemap.xml" /tmp/sitemap.xml
          fetch "/rfq.html" /tmp/rfq.html
          fetch "/karta.html" /tmp/karta.html
          fetch "/credibilidade.html" /tmp/credibilidade.html
          fetch "/source-ao/index.html" /tmp/source-ao.html
          fetch "/source-ao/opportunity-radar.html" /tmp/source-ao-radar.html
          fetch "/source-ao/runtime-config.js" /tmp/source-ao-runtime.js
          fetch "/procura.html" /tmp/procura-alias.html
          fetch "/images/source-ao-logo.svg" /tmp/source-ao-logo.svg

          grep -Fq "HMATIAS" /tmp/home.html
          grep -Fq "HMATIAS" /tmp/en.html
          grep -Fq "Sitemap: https://comercialhmatiasps.com/sitemap.xml" /tmp/robots.txt
          grep -Fq "SMART RFQ" /tmp/rfq.html
          grep -Fq "KARTA Wallet Mobile" /tmp/karta.html
          grep -Fq "Informação básica e verificável da empresa." /tmp/credibilidade.html
          grep -Fq "../images/source-ao-logo.svg" /tmp/source-ao.html
          grep -Fq "https://comercialhmatiasps.com/source-ao/index.html" /tmp/procura-alias.html
          grep -Fq "/source-ao/index.html" /tmp/procura-alias.html
          grep -Fq "SOURCE" /tmp/source-ao-logo.svg
          grep -Fq "Disallow: /source-ao/ops.html" /tmp/robots.txt
          grep -Fq "Disallow: /source-ao/review.html" /tmp/robots.txt
          grep -Fq "Disallow: /source-ao/requests.html" /tmp/robots.txt
          grep -Fq "Disallow: /source-ao/website-leads.html" /tmp/robots.txt
          grep -Fq "Disallow: /source-ao/supplier-discovery.html" /tmp/robots.txt
          grep -Fq "Disallow: /source-ao/backend/" /tmp/robots.txt

          for hidden_path in \
            "/source-ao/ops.html" \
            "/source-ao/ops.js" \
            "/source-ao/ops.css" \
            "/source-ao/review.html" \
            "/source-ao/review.js" \
            "/source-ao/review.css" \
            "/source-ao/requests.html" \
            "/source-ao/requests.js" \
            "/source-ao/requests.css" \
            "/source-ao/supplier-discovery.html" \
            "/source-ao/supplier-discovery.js" \
            "/source-ao/website-leads.html" \
            "/source-ao/website-leads-ops.js" \
            "/source-ao/data/suppliers.json" \
            "/source-ao/data/services.json" \
            "/source-ao/data/observations.json" \
            "/source-ao/data/verification-queue.json" \
            "/source-ao/data/acceptance-cases.json" \
            "/source-ao/backend/src/router.js" \
            "/source-ao/backend/.env.staging.example" \
            "/source-ao/docs/MARKETS.md" \
            "/source-ao/data-contract.json"; do
            hidden_status="$(curl --silent --output /dev/null --write-out '%{http_code}'               --location --connect-timeout 15 --max-time 30 "$base$hidden_path" || true)"
            if [ "$hidden_status" = "200" ]; then
              echo "ERROR: private Source AO build material is publicly accessible: $hidden_path"
              exit 1
            fi
          done
          grep -Fq "Disallow: /source-ao/docs/" /tmp/robots.txt

          if grep -Eq 'href="[^"]*(ops|review|requests)\.html' /tmp/source-ao.html /tmp/source-ao-radar.html; then
            echo "ERROR: public SOURCE AO page links to an internal desk"
            exit 1
          fi

          if grep -Eq 'ADMIN_API_TOKEN|PILOT_ADMIN_API_TOKEN|Bearer[[:space:]]|authorization:' /tmp/source-ao-runtime.js; then
            echo "ERROR: public SOURCE AO runtime config contains admin material"
            exit 1
          fi

          api_base="$(sed -n 's/.*apiBase:[[:space:]]*"\([^"]*\)".*/\1/p' /tmp/source-ao-runtime.js | head -n1)"
          if [ -z "$api_base" ]; then
            echo "ERROR: unable to resolve SOURCE AO API base from production runtime config"
            exit 1
          fi
          admin_probe_status="$(curl --silent --output /tmp/source-ao-admin-probe.json --write-out '%{http_code}'             --connect-timeout 15 --max-time 30 "$api_base/api/admin/partner-network" || true)"
          if [ "$admin_probe_status" != "401" ]; then
            echo "ERROR: unauthenticated SOURCE AO admin endpoint returned HTTP $admin_probe_status instead of 401"
            cat /tmp/source-ao-admin-probe.json || true
            exit 1
          fi

          python3 - <<'PY'
          import re
          import xml.etree.ElementTree as ET

          root = ET.parse('/tmp/sitemap.xml').getroot()
          ns = {'sm': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          urls = [n.text.strip() for n in root.findall('sm:url/sm:loc', ns) if n.text]
          if not urls:
              raise SystemExit('Production sitemap is valid XML but contains no URLs')
          if 'https://comercialhmatiasps.com/' not in urls:
              raise SystemExit('Production sitemap does not contain the homepage')

          for path, credibility in (('/tmp/home.html', 'credibilidade.html'), ('/tmp/en.html', 'credibility.html')):
              html = open(path, encoding='utf-8').read()
              nav = html.partition('<nav class="nav-menu"')[2].partition('</nav>')[0]
              if nav and credibility in nav:
                  raise SystemExit(f'Credibility link leaked back into primary navigation: {path}')

          credibility = open('/tmp/credibilidade.html', encoding='utf-8').read()
          card = credibility.partition('<aside class="institutional-card institutional-contact">')[2].partition('</aside>')[0]
          if not card or card.count('mailto:geral@comercialhmatiasps.com') != 1:
              raise SystemExit('Production credibility contact block is duplicated or malformed')

          print(f'Production sitemap OK: {len(urls)} URLs')
          PY

          status_404="$(curl --silent --output /tmp/404-live.html --write-out '%{http_code}' \
            --location --connect-timeout 15 --max-time 30 "$base/__hmatias_missing_page_smoke__" || true)"
          if [ "$status_404" != "404" ]; then
            echo "ERROR: expected production 404 status, got $status_404"
            exit 1
          fi
          grep -Fq "Página não encontrada." /tmp/404-live.html

          git_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --location --connect-timeout 15 --max-time 30 "$base/.git/config" || true)"
          if [ "$git_status" = "200" ]; then
            echo "ERROR: /.git/config is publicly accessible"
            exit 1
          fi

          echo "HMATIAS production smoke test OK."

  indexnow:
    needs: production-smoke-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify public URL selection
        run: python3 -m unittest discover -s .github/scripts -p 'test_indexnow.py'
      - name: Notify IndexNow after successful publication
        env:
          INDEXNOW_BEFORE: ${{ github.event.before }}
        run: python3 .github/scripts/indexnow.py --submit
