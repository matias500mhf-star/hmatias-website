name: HMATIAS Live Publication Freshness
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-publication-freshness.yml'

permissions:
  contents: read

jobs:
  public-content:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check visible editorial content and private URL boundary
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const base='https://comercialhmatiasps.com';
          const editorial=[
            {path:'/credibilidade.html',markers:['Missão, visão e princípios de trabalho','Inovação e projetos digitais']},
            {path:'/source-ao/index.html',markers:['Pesquisa técnica de materiais e fornecedores.']},
            {path:'/karta.html',markers:['PROJETOS DIGITAIS HMATIAS']},
            {path:'/website-lead-client.js',markers:['HMATIAS website lead capture']}
          ];
          const hidden=[
            '/source-ao/website-leads.html','/source-ao/website-leads-ops.js',
            '/source-ao/supplier-discovery.html','/source-ao/supplier-discovery.js'
          ];
          const wait=ms=>new Promise(resolve=>setTimeout(resolve,ms));
          async function sample(path){
            const url=new URL(base+path);
            url.searchParams.set('audit',String(Date.now()));
            const response=await fetch(url,{
              headers:{'cache-control':'no-cache'},
              signal:AbortSignal.timeout(18000),
              redirect:'follow'
            });
            const body=await response.text();
            const header=name=>response.headers.get(name)||'';
            const data={
              path,status:response.status,
              cache:header('cf-cache-status')||header('x-cache')||'not supplied',
              age:header('age')||'not supplied',
              last_modified:header('last-modified')||'not supplied',
              bytes:body.length
            };
            console.log('PUBLIC HTTP:',JSON.stringify(data));
            return {response,body};
          }
          const issues=[];
          for(const target of editorial){
            let good=false;
            for(let attempt=1;attempt<=3;attempt++){
              try{
                const {response,body}=await sample(target.path);
                const missing=target.markers.filter(marker=>!body.includes(marker));
                if(response.ok&&missing.length===0){good=true;break;}
                console.log('Content mismatch:',target.path,'missing=',JSON.stringify(missing),'attempt=',attempt);
              }catch(e){console.log('Public audit fetch failed:',target.path,e.name,'attempt=',attempt);}
              if(attempt<3)await wait(3500);
            }
            if(!good)issues.push('Current approved editorial copy is not visible: '+target.path);
          }
          for(const path of hidden){
            try{
              const {response}=await sample(path);
              if(response.status===200)issues.push('Private Source AO page unexpectedly served publicly: '+path);
            }catch(e){
              console.log('Private path check could not complete:',path,e.name);
              issues.push('Could not verify private path: '+path);
            }
          }
          if(issues.length){
            console.error('HMATIAS PUBLICATION AUDIT FAILED:',JSON.stringify(issues));
            process.exitCode=1;
          }else console.log('HMATIAS PUBLICATION AUDIT PASS: latest editorial copy is visible and private pages are not publicly distributed.');
          NODE
