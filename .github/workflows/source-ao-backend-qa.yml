name: SOURCE AO Backend QA

on:
  pull_request:
    paths:
      - 'source-ao/backend/**'
      - 'source-ao/requests.js'
      - 'source-ao/rfq.js'
      - 'source-ao/rfq-model.js'
      - '.github/workflows/source-ao-backend-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-ao-backend-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-qa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: source-ao/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install backend tooling
        run: npm install --no-audit --no-fund

      - name: Run syntax checks and complete backend test suite
        run: npm run check
