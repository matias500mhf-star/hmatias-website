name: Restore HMATIAS logo quality

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore-logo:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force original lossless logo on every public page
        run: |
          python - <<'PY'
          from pathlib import Path
          source = '<source srcset="logo-hmatias.webp" type="image/webp">'
          changed = []
          for p in Path('.').glob('*.html'):
              s = p.read_text(encoding='utf-8')
              ns = s.replace(source, '')
              if ns != s:
                  p.write_text(ns, encoding='utf-8')
                  changed.append(p.name)
          print('Updated:', ', '.join(changed) if changed else 'none')
          PY
      - name: Commit restored logo references
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html'
          if git diff --cached --quiet; then
            echo 'No logo references needed changing'
          else
            git commit -m 'fix(brand): restore original lossless HMATIAS logo across site'
            git push
          fi
