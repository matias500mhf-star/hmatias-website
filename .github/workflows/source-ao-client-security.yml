name: Source AO Client Integration Security

on:
  pull_request:
    paths:
      - "source-ao/**"
      - "scripts/smoke-source-ao-client-security.mjs"
      - "scripts/smoke-source-ao-rfq.mjs"
      - ".github/workflows/source-ao-client-security.yml"
  push:
    branches:
      - main
    paths:
      - "source-ao/**"
      - "scripts/smoke-source-ao-client-security.mjs"
      - ".github/workflows/source-ao-client-security.yml"

permissions:
  contents: read

jobs:
  source-ao-client-security:
    name: Source AO Client Security
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check public client integration
        run: node scripts/smoke-source-ao-client-security.mjs
      - name: Check SOURCE AO RFQ journey
        run: node scripts/smoke-source-ao-rfq.mjs
