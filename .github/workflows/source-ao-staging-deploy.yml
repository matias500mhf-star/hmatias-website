name: Source AO Staging Deploy

# This launcher lives on main so GitHub exposes the manual Run workflow action.
# Only the reviewed Source AO commit is checked out and deployed to staging.
# Updating the release requires a separate review of this pinned commit.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY-STAGING to continue'
        required: true
        type: string
      run_pilot:
        description: 'Run synthetic end-to-end pilot after deploy'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: source-ao-staging-deploy
  cancel-in-progress: false

jobs:
  deploy-staging:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm == 'DEPLOY-STAGING' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    environment: source-ao-staging
    defaults:
      run:
        working-directory: source-ao/backend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      SOURCE_AO_STAGING_D1_ID: ${{ secrets.SOURCE_AO_STAGING_D1_ID || vars.SOURCE_AO_STAGING_D1_ID }}
      SOURCE_AO_STAGING_PUBLIC_ORIGIN: ${{ vars.SOURCE_AO_STAGING_PUBLIC_ORIGIN || secrets.SOURCE_AO_STAGING_PUBLIC_ORIGIN }}
      SOURCE_AO_API_BASE: ${{ vars.SOURCE_AO_STAGING_API_BASE || secrets.SOURCE_AO_STAGING_API_BASE }}
      SOURCE_AO_RUN_PILOT: ${{ inputs.run_pilot }}

    steps:
      - name: Checkout reviewed Source AO release
        uses: actions/checkout@v5
        with:
          ref: aaf955c518a7a6f042d9fea3c5cc2c19e9d5eb3c
          persist-credentials: false

      - name: Setup Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Preflight protected staging values
        shell: bash
        run: |
          set -euo pipefail
          required=(
            CLOUDFLARE_API_TOKEN
            CLOUDFLARE_ACCOUNT_ID
            SOURCE_AO_STAGING_D1_ID
            SOURCE_AO_STAGING_PUBLIC_ORIGIN
            SOURCE_AO_API_BASE
          )
          missing=()
          for key in "${required[@]}"; do
            if [ -z "${!key:-}" ]; then
              missing+=("$key")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            for key in "${missing[@]}"; do
              echo "::error title=Incomplete staging configuration::Missing protected staging value: $key" >&2
            done
            echo 'Configure the missing names in GitHub Settings > Environments > source-ao-staging before starting a new run.' >&2
            exit 2
          fi
          case "$CLOUDFLARE_API_TOKEN" in
            Bearer\ *|bearer\ *)
              echo '::error title=Malformed Cloudflare API token::CLOUDFLARE_API_TOKEN must contain only the raw token value, without the Bearer prefix.' >&2
              exit 2
              ;;
            \"*\"|\'*\')
              echo '::error title=Malformed Cloudflare API token::CLOUDFLARE_API_TOKEN must not include surrounding quotes.' >&2
              exit 2
              ;;
          esac
          if [[ "$CLOUDFLARE_API_TOKEN" =~ [[:space:]] ]]; then
            echo '::error title=Malformed Cloudflare API token::CLOUDFLARE_API_TOKEN contains whitespace. Paste only the raw Cloudflare API token.' >&2
            exit 2
          fi
          case "$SOURCE_AO_STAGING_PUBLIC_ORIGIN" in https://*) ;; *) echo 'Staging public origin must use HTTPS' >&2; exit 2;; esac
          case "$SOURCE_AO_API_BASE" in https://*) ;; *) echo 'Staging API base must use HTTPS' >&2; exit 2;; esac

      - name: Install backend tooling
        run: npm install --no-audit --no-fund

      - name: Run backend QA before deployment
        run: npm run check

      - name: Generate runtime API staging config
        # Report the application commit, not the launcher's main-branch commit.
        run: GITHUB_SHA="$(git rev-parse HEAD)" node scripts/prepare-staging-config.mjs

      - name: Verify existing Cloudflare Worker secrets
        # Values stay in Cloudflare. The API readiness test validates them after deploy.
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler secret list --format json --config wrangler.staging.runtime.jsonc > "$RUNNER_TEMP/source-ao-secret-names.json"
          node --input-type=module - "$RUNNER_TEMP/source-ao-secret-names.json" <<'NODE'
          import {readFileSync} from 'node:fs';
          const records=JSON.parse(readFileSync(process.argv[2],'utf8'));
          if(!Array.isArray(records)) throw new Error('Invalid Worker secret metadata response');
          const names=new Set(records.map(record=>record.name));
          const required=['ADMIN_API_TOKEN','CONFIRMATION_SECRET','PII_ENCRYPTION_KEY','RATE_LIMIT_SECRET'];
          const missing=required.filter(name=>!names.has(name));
          if(missing.length){
            for(const name of missing) console.error(`::error title=Cloudflare Worker secret missing::Configure ${name} on source-ao-api-staging before deployment.`);
            process.exit(2);
          }
          console.log('All four Worker secret names are present. Existing values will be preserved.');
          NODE

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply source-ao-staging --remote --config wrangler.staging.runtime.jsonc

      - name: Seed curated Source AO search index
        shell: bash
        run: |
          set -euo pipefail
          seed_file="$RUNNER_TEMP/source-ao-curated-seed.sql"
          node scripts/export-seed-sql.mjs > "$seed_file"
          test -s "$seed_file"
          npx wrangler d1 execute source-ao-staging --remote --file="$seed_file" --config wrangler.staging.runtime.jsonc
          rm -f "$seed_file"

      - name: Prove private D1 export path
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .staging-backup
          backup=.staging-backup/source-ao-staging.sql
          npx wrangler d1 export source-ao-staging --remote --skip-confirmation --output="$backup" --config wrangler.staging.runtime.jsonc
          test -s "$backup"
          grep -q 'CREATE TABLE' "$backup"
          bytes=$(wc -c < "$backup" | tr -d ' ')
          echo "Private D1 export validated (${bytes} bytes); file will not be uploaded as an artifact."
          rm -f "$backup"
          rmdir .staging-backup

      - name: Generate ephemeral staging validation credential
        shell: bash
        run: |
          set -euo pipefail
          token="$(openssl rand -hex 32)"
          echo "::add-mask::$token"
          echo "SOURCE_AO_PILOT_TOKEN=$token" >> "$GITHUB_ENV"
          VALIDATION_TOKEN="$token" node --input-type=module -e '
            import {readFileSync,writeFileSync} from "node:fs";
            const path="wrangler.staging.runtime.jsonc";
            const config=JSON.parse(readFileSync(path,"utf8"));
            config.vars={...(config.vars||{}),PILOT_ADMIN_API_TOKEN:process.env.VALIDATION_TOKEN};
            writeFileSync(path,JSON.stringify(config,null,2)+"\n",{mode:0o600});
          '

      - name: Validate generated staging runtime config
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import {readFileSync} from "node:fs";
            const config=JSON.parse(readFileSync("wrangler.staging.runtime.jsonc","utf8"));
            if(config?.vars?.PILOT_ADMIN_API_TOKEN!==process.env.SOURCE_AO_PILOT_TOKEN){
              throw new Error("Temporary validation token missing from runtime config");
            }
            console.log("Generated staging runtime config is valid JSON and contains the masked validation binding.");
          '

      - name: Deploy staging API Worker
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config wrangler.staging.runtime.jsonc
          echo "SOURCE_AO_VALIDATION_DEPLOYED=true" >> "$GITHUB_ENV"

      - name: Smoke test deployed staging API
        run: npm run smoke:staging

      - name: Build allowlisted staging frontend
        run: npm run build:web:staging

      - name: Deploy isolated staging frontend
        run: npx wrangler deploy --config wrangler.web.staging.runtime.jsonc

      - name: Smoke test staging frontend isolation
        run: npm run smoke:web:staging

      - name: Wait for staging validation credential
        shell: bash
        run: |
          set -euo pipefail
          response_file="$RUNNER_TEMP/source-ao-validation-probe.json"
          authenticated=false
          for attempt in $(seq 1 12); do
            code="$(curl -sS -o "$response_file" -w '%{http_code}'               -H "accept: application/json"               -H "authorization: Bearer $SOURCE_AO_PILOT_TOKEN"               "$SOURCE_AO_API_BASE/api/admin/sourcing-requests?limit=1" || true)"
            if [ "$code" = "200" ]; then
              authenticated=true
              echo "Ephemeral staging validation credential active after attempt $attempt."
              break
            fi
            if [ "$code" != "401" ]; then
              echo "::warning title=Validation credential probe::Unexpected HTTP $code while waiting for staging auth." >&2
            fi
            sleep 2
          done
          rm -f "$response_file"
          if [ "$authenticated" != "true" ]; then
            echo "::error title=Validation credential unavailable::Ephemeral staging credential did not become active within the retry window." >&2
            exit 1
          fi

      - name: Seed synthetic supplier for optional pilot
        if: ${{ inputs.run_pilot }}
        run: npx wrangler d1 execute source-ao-staging --remote --file=staging/seed.sql --config wrangler.staging.runtime.jsonc

      - name: Run synthetic end-to-end pilot
        if: ${{ inputs.run_pilot }}
        env:
          SOURCE_AO_TEST_SUPPLIER_ID: sup_test_staging
        run: ADMIN_API_TOKEN="$SOURCE_AO_PILOT_TOKEN" npm run pilot:staging

      - name: Run real lost-client acceptance
        run: ADMIN_API_TOKEN="$SOURCE_AO_PILOT_TOKEN" npm run acceptance:staging

      - name: Run staging contact-retention drill
        run: ADMIN_API_TOKEN="$SOURCE_AO_PILOT_TOKEN" npm run retention:staging

      - name: Remove ephemeral staging validation credential
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f wrangler.staging.runtime.jsonc ] && [ "${SOURCE_AO_VALIDATION_DEPLOYED:-false}" = "true" ]; then
            node --input-type=module -e '
              import {readFileSync,writeFileSync} from "node:fs";
              const path="wrangler.staging.runtime.jsonc";
              const config=JSON.parse(readFileSync(path,"utf8"));
              if(config.vars) delete config.vars.PILOT_ADMIN_API_TOKEN;
              writeFileSync(path,JSON.stringify(config,null,2)+"\n",{mode:0o600});
            '
            npx wrangler deploy --config wrangler.staging.runtime.jsonc
            probe_file="$RUNNER_TEMP/source-ao-validation-cleanup-probe.json"
            code="$(curl -sS -o "$probe_file" -w '%{http_code}'               -H "accept: application/json"               -H "authorization: Bearer $SOURCE_AO_PILOT_TOKEN"               "$SOURCE_AO_API_BASE/api/admin/sourcing-requests?limit=1" || true)"
            rm -f "$probe_file"
            if [ "$code" != "401" ]; then
              echo "::error title=Validation credential cleanup failed::Expected old staging validation token to be rejected with HTTP 401, got $code." >&2
              exit 1
            fi
            echo "Ephemeral staging validation credential removed and rejected."
          fi

      - name: Remove generated sensitive temporary files
        if: ${{ always() }}
        shell: bash
        run: |
          rm -f wrangler.staging.runtime.jsonc wrangler.web.staging.runtime.jsonc
          rm -f "$RUNNER_TEMP/source-ao-secret-names.json" "$RUNNER_TEMP/source-ao-curated-seed.sql"
          rm -f "$RUNNER_TEMP/source-ao-pilot-secret.json" "$RUNNER_TEMP/source-ao-pilot-secret-delete.json"
          rm -f "$RUNNER_TEMP/source-ao-validation-probe.json" "$RUNNER_TEMP/source-ao-validation-cleanup-probe.json"
          rm -rf .staging-backup .staging-web
