name: HMATIAS Platform Modernization QA

on:
  push:
    branches:
      - "feat/hmatias-platform-modernization-20261111"
    paths:
      - "package.json"
      - "scripts/**"
      - "style.css"
      - "typography.css"
      - "home-*.css"
      - "header.css"
      - "index.html"
      - "en.html"
      - "credibilidade.html"
      - "credibility.html"
      - "source-ao/**"
      - "lead-intake/**"
      - ".github/workflows/platform-modernization-qa.yml"
  pull_request:
    branches:
      - "main"
    paths:
      - "package.json"
      - "scripts/**"
      - "style.css"
      - "typography.css"
      - "home-*.css"
      - "header.css"
      - "index.html"
      - "en.html"
      - "credibilidade.html"
      - "credibility.html"
      - "source-ao/**"
      - "lead-intake/**"
      - ".github/workflows/platform-modernization-qa.yml"

permissions:
  contents: read

concurrency:
  group: hmatias-platform-modernization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-validation:
    name: Static, content and safety validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install locked root development dependencies
        run: npm ci

      - name: Inventory platform structure
        run: npm run audit:platform

      - name: Validate generated CSS bundles
        run: node scripts/build-home-css.mjs

      - name: Run commercial and integration regression checks
        run: node scripts/check-commercial-audit.mjs

      - name: Validate sitemap pages and local asset references
        run: python3 scripts/check-public-site-assets.py

      - name: Test consent-aware lead intake
        run: node --test lead-intake/test.mjs

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find . \
            -path './.git' -prune -o \
            -path './node_modules' -prune -o \
            -path './.wrangler' -prune -o \
            -type f -name '*.js' -print0 \
            | xargs -0 -r -n 1 node --check

      # Deliberately no Vite build, Pages deployment or Wrangler deployment here.
      # Production publishing remains exclusively on the existing main-branch workflow.
