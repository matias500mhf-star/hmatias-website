name: HMATIAS Platform Modernization QA

on:
  push:
    branches:
      - "feat/hmatias-platform-modernization-20261111"
    paths:
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - "style.css"
      - "typography.css"
      - "home-*.css"
      - "header.css"
      - "index.html"
      - "en.html"
      - "credibilidade.html"
      - "credibility.html"
      - "source-ao/**"
      - "lead-intake/**"
      - ".github/workflows/platform-modernization-qa.yml"
  pull_request:
    branches:
      - "main"
    paths:
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - "style.css"
      - "typography.css"
      - "home-*.css"
      - "header.css"
      - "index.html"
      - "en.html"
      - "credibilidade.html"
      - "credibility.html"
      - "source-ao/**"
      - "lead-intake/**"
      - ".github/workflows/platform-modernization-qa.yml"

permissions:
  contents: write

concurrency:
  group: hmatias-platform-modernization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-validation:
    name: Static, content and safety validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # First-party Actions use the Node 24 runtime on current GitHub-hosted runners.
      - name: Checkout isolated branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Check whether the pinned root dependency lockfile needs refresh
        id: root-lock
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/hmatias-platform-modernization-20261111'
        run: |
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import {readFileSync} from 'node:fs';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const expected = pkg.devDependencies ?? {};
          const locked = lock.packages?.['']?.devDependencies ?? {};
          let refresh = Object.entries(expected).some(([name, version]) => locked[name] !== version);
          const sourceMap = lock.packages?.['node_modules/source-map-js']?.version ?? '0.0.0';
          const parts = sourceMap.split('.').map(Number);
          const sourceMapIsPatched = parts[0] > 1 || (parts[0] === 1 && (parts[1] > 2 || (parts[1] === 2 && parts[2] >= 2)));
          if (!sourceMapIsPatched) refresh = true;
          console.log('refresh=' + String(refresh));
          console.log('Locked source-map-js:', sourceMap);
          NODE

      - name: Refresh the pinned root dependency lockfile on this isolated branch
        if: steps.root-lock.outputs.refresh == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm update source-map-js --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit --audit-level=high
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: refresh root dependency lockfile"
            git fetch origin feat/hmatias-platform-modernization-20261111
            git rebase FETCH_HEAD
            git push origin HEAD:feat/hmatias-platform-modernization-20261111
          fi

      - name: Install locked root development dependencies
        run: npm ci

      - name: Enforce high-severity dependency security floor
        run: npm audit --audit-level=high

      - name: Report dependency advisories without auto-fixing
        shell: bash
        run: |
          set +e
          npm audit --json > "$RUNNER_TEMP/hmatias-npm-audit.json"
          audit_exit=$?
          set -e
          NPM_AUDIT_EXIT="$audit_exit" node - "$RUNNER_TEMP/hmatias-npm-audit.json" <<'NODE'
          const fs = require('node:fs');
          const path = process.argv[2];
          try {
            const report = JSON.parse(fs.readFileSync(path, 'utf8'));
            const totals = report.metadata?.vulnerabilities ?? {};
            console.log('Root dependency advisory summary:', JSON.stringify(totals));
            for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
              const via = (item.via ?? []).map(entry =>
                typeof entry === 'string' ? entry : (entry.title ?? entry.name ?? 'advisory')
              );
              console.log(
                `- ${item.severity}: ${name}; direct=${item.isDirect}; range=${item.range}; fix=${JSON.stringify(item.fixAvailable)}; via=${via.join(' | ')}`
              );
            }
            console.log('Audit exit code:', process.env.NPM_AUDIT_EXIT ?? 'non-zero findings may be present');
          } catch (error) {
            console.log('Dependency audit result could not be parsed:', error.message);
          }
          NODE
          echo "This report stage is read-only; lockfile refreshes run separately and only on the isolated branch."

      - name: Inventory platform structure
        run: npm run audit:platform

      - name: Map shared page dependencies
        run: npm run map:page-dependencies

      - name: Validate generated CSS bundles
        run: node scripts/build-home-css.mjs

      - name: Run commercial and integration regression checks
        run: node scripts/check-commercial-audit.mjs

      - name: Validate sitemap pages and local asset references
        run: python3 scripts/check-public-site-assets.py

      - name: Test consent-aware lead intake
        run: node --test lead-intake/test.mjs

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find . \
            -path './.git' -prune -o \
            -path './node_modules' -prune -o \
            -path './.wrangler' -prune -o \
            -type f -name '*.js' -print0 \
            | xargs -0 -r -n 1 node --check

      # Deliberately no Vite build, Pages deployment or Wrangler deployment here.
      # Production publishing remains exclusively on the existing main-branch workflow.
