name: HMATIAS AI Worker Configuration

on:
  pull_request:
    paths:
      - 'wrangler.jsonc'
      - 'cloudflare-ai/**'
      - '.github/workflows/hmatias-ai-worker-deploy.yml'
  push:
    branches: [main]
    paths:
      - 'wrangler.jsonc'
      - 'cloudflare-ai/**'
      - '.github/workflows/hmatias-ai-worker-deploy.yml'

permissions:
  contents: read

concurrency:
  group: hmatias-ai-worker-validation
  cancel-in-progress: false

jobs:
  validate:
    name: Validate root and source Worker configs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Validate root config used by Cloudflare Builds
        run: npx --yes wrangler@4 deploy --dry-run --config wrangler.jsonc
      - name: Validate source-folder config
        working-directory: cloudflare-ai
        run: npx --yes wrangler@4 deploy --dry-run --config wrangler.jsonc
