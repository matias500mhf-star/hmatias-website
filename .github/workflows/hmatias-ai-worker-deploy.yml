name: HMATIAS AI Worker Deploy

on:
  pull_request:
    paths:
      - 'cloudflare-ai/**'
      - 'assistant-api-bridge.js'
      - '.github/workflows/hmatias-ai-worker-deploy.yml'
  push:
    branches: [main]
    paths:
      - 'cloudflare-ai/**'
      - 'assistant-api-bridge.js'
      - '.github/workflows/hmatias-ai-worker-deploy.yml'

permissions:
  contents: read

concurrency:
  group: hmatias-ai-assistant-worker
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Worker code, config and bridge
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check assistant API bridge syntax
        run: node --check assistant-api-bridge.js
      - name: Validate assistant bridge loads before assistant
        run: |
          node --input-type=module <<'NODE'
          import {readdirSync,readFileSync} from 'node:fs';
          const pages=readdirSync('.').filter(name=>name.endsWith('.html'));
          const checked=[];
          for(const page of pages){
            const html=readFileSync(page,'utf8');
            const assistant=html.indexOf('assistant.js?v=20261028-nif-word-boundary1');
            if(assistant<0) continue;
            const bridge=html.indexOf('assistant-api-bridge.js?v=20261027-workers-dev-api1');
            if(bridge<0||bridge>assistant) throw new Error('AI API bridge missing or ordered after assistant.js in '+page);
            checked.push(page);
          }
          if(checked.length<20) throw new Error('Unexpectedly few assistant pages validated: '+checked.length);
          console.log('PASS: API bridge precedes assistant.js on '+checked.length+' pages.');
          NODE
      - name: Confirm the separate root Wrangler config is not the assistant target
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const config = JSON.parse(readFileSync('wrangler.jsonc', 'utf8'));
          if (config.name !== 'hmatias-website1') {
            throw new Error(`Unexpected root Worker name: ${config.name}`);
          }
          console.log('PASS: root Wrangler config remains separate from the assistant Worker.');
          NODE
      - name: Validate source-folder config
        working-directory: cloudflare-ai
        run: npx --yes wrangler@4 deploy --dry-run --config wrangler.jsonc
      - name: Smoke-test deployed workers.dev health endpoint
        shell: bash
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/hmatias-ai-health.json"
          code="$(curl --silent --show-error --output "$response" --write-out '%{http_code}' --retry 5 --retry-all-errors --retry-delay 2 'https://hmatias-ai-assistant.matias500-mhf.workers.dev/api/ai')"
          [ "$code" = "200" ] || { echo "::error::Worker health endpoint returned HTTP $code"; cat "$response"; exit 1; }
          node --input-type=module - "$response" <<'NODE'
          import {readFileSync} from 'node:fs';
          const data=JSON.parse(readFileSync(process.argv[2],'utf8'));
          if(data.status!=='ok'||data.service!=='hmatias-ai-assistant') throw new Error('Unexpected Worker health response');
          console.log('PASS: deployed workers.dev API health endpoint is responding.');
          NODE
      - name: Smoke-test real AI response from workers.dev
        shell: bash
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/hmatias-ai-chat.json"
          code="$(curl --silent --show-error --output "$response" --write-out '%{http_code}' \
            --request POST 'https://hmatias-ai-assistant.matias500-mhf.workers.dev/api/ai' \
            --header 'Origin: https://comercialhmatiasps.com' \
            --header 'Content-Type: application/json' \
            --data '{"message":"Responda apenas com OK."}')"
          [ "$code" = "200" ] || { echo "::error::Worker chat endpoint returned HTTP $code"; cat "$response"; exit 1; }
          node --input-type=module - "$response" <<'NODE'
          import {readFileSync} from 'node:fs';
          const data=JSON.parse(readFileSync(process.argv[2],'utf8'));
          const answer=typeof data.answer==='string'?data.answer:data.reply;
          if(typeof answer!=='string'||!answer.trim()) throw new Error('The Worker returned no AI answer.');
          console.log('PASS: workers.dev returned a non-empty AI answer.');
          NODE

  deploy:
    name: Deploy and verify workers.dev API
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: source-ao-staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || missing+=("CLOUDFLARE_API_TOKEN")
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || missing+=("CLOUDFLARE_ACCOUNT_ID")
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error title=Missing Cloudflare configuration::Missing secret or variable: %s\n' "${missing[*]}"
            exit 2
          fi
          case "$CLOUDFLARE_API_TOKEN" in Bearer\ *|bearer\ *) echo "::error::CLOUDFLARE_API_TOKEN must be the raw token value."; exit 2;; esac
          if [[ "$CLOUDFLARE_API_TOKEN" =~ [[:space:]] ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN contains whitespace."
            exit 2
          fi
      - name: Assert assistant Worker deployment target
        working-directory: cloudflare-ai
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const config = JSON.parse(readFileSync('wrangler.jsonc', 'utf8'));
          if (config.name !== 'hmatias-ai-assistant') {
            throw new Error(`Refusing to deploy unexpected Worker name: ${config.name}`);
          }
          if (config.main !== 'src/index.js') {
            throw new Error(`Unexpected assistant entry point: ${config.main}`);
          }
          console.log('PASS: deployment target is hmatias-ai-assistant from cloudflare-ai/wrangler.jsonc.');
          NODE
      - name: Deploy Worker to workers.dev
        working-directory: cloudflare-ai
        run: npx --yes wrangler@4 deploy --config wrangler.jsonc
      - name: Verify workers.dev API health
        shell: bash
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/hmatias-ai-health.json"
          code="$(curl --silent --show-error --output "$response" --write-out '%{http_code}' --retry 10 --retry-all-errors --retry-delay 3 'https://hmatias-ai-assistant.matias500-mhf.workers.dev/api/ai')"
          if [ "$code" != "200" ]; then
            echo "::error title=AI health check failed::GET workers.dev /api/ai returned HTTP $code."
            cat "$response"
            exit 1
          fi
          node --input-type=module - "$response" <<'NODE'
          import {readFileSync} from 'node:fs';
          const data=JSON.parse(readFileSync(process.argv[2],'utf8'));
          if(data.status!=='ok'||data.service!=='hmatias-ai-assistant') throw new Error('Unexpected AI health response');
          console.log('PASS: workers.dev HMATIAS AI API health endpoint is responding.');
          NODE
      - name: Verify real AI chat response
        shell: bash
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/hmatias-ai-chat.json"
          code="$(curl --silent --show-error --output "$response" --write-out '%{http_code}' \
            --request POST 'https://hmatias-ai-assistant.matias500-mhf.workers.dev/api/ai' \
            --header 'Origin: https://comercialhmatiasps.com' \
            --header 'Content-Type: application/json' \
            --data '{"message":"Responda apenas com OK."}')"
          if [ "$code" != "200" ]; then
            echo "::error title=AI chat smoke test failed::POST workers.dev /api/ai returned HTTP $code."
            cat "$response"
            exit 1
          fi
          node --input-type=module - "$response" <<'NODE'
          import {readFileSync} from 'node:fs';
          const data=JSON.parse(readFileSync(process.argv[2],'utf8'));
          const answer=typeof data.answer==='string'?data.answer:data.reply;
          if(typeof answer!=='string'||!answer.trim()) throw new Error('The AI API returned no answer.');
          console.log('PASS: HMATIAS AI chat returned a non-empty answer.');
          NODE
