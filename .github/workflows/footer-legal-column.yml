name: Separate Legal footer column

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  footer-legal-column:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move Legal into its own footer column
        run: |
          python - <<'PY'
          from pathlib import Path

          pt_old = '<a href="https://wa.me/244948806673" target="_blank" rel="noopener">WhatsApp</a><strong>Legal</strong><a href="privacidade.html">Política de Privacidade</a><a href="termos.html">Termos & Condições</a></div>'
          pt_new = '<a href="https://wa.me/244948806673" target="_blank" rel="noopener">WhatsApp</a></div><div><strong>Legal</strong><a href="privacidade.html">Política de Privacidade</a><a href="termos.html">Termos & Condições</a></div>'

          en_old = '<a href="https://wa.me/244948806673" target="_blank" rel="noopener">WhatsApp</a><strong>Legal</strong><a href="privacy.html">Privacy Policy</a><a href="terms.html">Terms & Conditions</a></div>'
          en_new = '<a href="https://wa.me/244948806673" target="_blank" rel="noopener">WhatsApp</a></div><div><strong>Legal</strong><a href="privacy.html">Privacy Policy</a><a href="terms.html">Terms & Conditions</a></div>'

          changed = []
          for p in Path('.').glob('*.html'):
              s = p.read_text(encoding='utf-8')
              ns = s.replace(pt_old, pt_new).replace(en_old, en_new)
              if p.name in {'hmatias-clean.html', 'hmatias-clean-en.html'}:
                  ns = ns.replace('<div class="container footer-grid">', '<div class="container footer-grid clean-footer-grid">')
              if ns != s:
                  p.write_text(ns, encoding='utf-8')
                  changed.append(p.name)

          css = Path('style.css')
          s = css.read_text(encoding='utf-8')
          old_grid = '.footer-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:40px;padding-bottom:40px}'
          new_grid = '.footer-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;gap:40px;padding-bottom:40px}@media(min-width:851px){.footer-grid.clean-footer-grid{grid-template-columns:2fr 1fr 1fr 1fr}}'
          ns = s.replace(old_grid, new_grid)
          if ns != s:
              css.write_text(ns, encoding='utf-8')
              changed.append('style.css')

          if not changed:
              raise SystemExit('No footer changes detected; stopping without commit')
          print('Updated:', ', '.join(changed))
          PY
      - name: Commit footer column correction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html' style.css
          git commit -m 'fix(footer): place Legal in separate column'
          git push
