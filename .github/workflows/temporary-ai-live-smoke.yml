name: Temporary HMATIAS AI live smoke test

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect live AI health response
        shell: bash
        run: |
          set -u
          curl --silent --show-error --max-time 20 -D /tmp/health-headers.txt \
            -o /tmp/health-body.txt -w 'Health HTTP status: %{http_code}\n' \
            https://api.comercialhmatiasps.com/health || true
          echo '--- response headers ---'
          cat /tmp/health-headers.txt || true
          echo '--- response body ---'
          head -c 2000 /tmp/health-body.txt || true
          echo
      - name: Inspect live AI POST response
        shell: bash
        run: |
          set -u
          curl --silent --show-error --max-time 45 -D /tmp/ai-headers.txt \
            -o /tmp/ai-body.txt -w 'AI HTTP status: %{http_code}\n' \
            -X POST 'https://api.comercialhmatiasps.com/api/ai' \
            -H 'Origin: https://comercialhmatiasps.com' \
            -H 'Content-Type: application/json' \
            --data '{"message":"Indica apenas o email geral da HMATIAS."}' || true
          echo '--- response headers ---'
          cat /tmp/ai-headers.txt || true
          echo '--- response body ---'
          head -c 2000 /tmp/ai-body.txt || true
          echo
