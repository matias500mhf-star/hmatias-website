name: Temporary CSS bundle regeneration
on:
  push:
    branches:
      - fix/assistant-cache-alignment
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/assistant-cache-alignment
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/build-home-css.mjs --write
      - name: Commit generated CSS bundles if changed
        shell: bash
        run: |
          if git diff --quiet -- home-base.css home-details.css clean-base.css clean-details.css; then
            echo "All generated CSS bundles already match their source stylesheets"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home-base.css home-details.css clean-base.css clean-details.css
          git commit -m "Regenerate generated CSS bundles from source"
          git push origin HEAD:fix/assistant-cache-alignment
