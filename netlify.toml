[build]
  command = ""
  publish = "."

# Este projeto Netlify destina-se exclusivamente à avaliação da branch de preview.
# Não associar o domínio oficial HMATIAS a este site.
[[redirects]]
  from = "/"
  to = "/preview/hmatias/"
  status = 302
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
