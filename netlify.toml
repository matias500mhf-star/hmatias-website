[build]
  base = "platform/astro-preview"
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "26.13.0"

# Preview isolado: nunca associar o domínio oficial HMATIAS a este site.
# O cabeçalho impede indexação de todos os deploys deste projecto.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
