 <filter id="shadowA" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur stdDeviation="12"/></filter>
 <pattern id="ribsA" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M2 0V18" stroke="#6e879a" stroke-opacity=".34" stroke-width="2"/></pattern>
