<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Perspectiva conceptual — Alternativa A</title><desc id="desc">Vista arquitectónica conceptual de um armazém compacto com escritório frontal, zona de carga e cobertura lateral de apoio.</desc>
<defs>
