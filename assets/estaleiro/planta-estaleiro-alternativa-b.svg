<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
<title id="title">Estaleiro Integrado HMATIAS - Alternativa B</title><desc id="desc">Planta de implantação preliminar para terreno de 15,141 por 25 metros. Armazém de 140 metros quadrados, escritório e corredor lateral de acesso.</desc>
