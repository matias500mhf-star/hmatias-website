<g font-family="Arial,sans-serif" fill="#0b2c4a"><text x="455" y="579" font-size="13" font-weight="700">01  Armazém fechado</text><text x="665" y="579" font-size="12" fill="#65798b">Capacidade de armazenagem de 140 m²; zonas A/B esquemáticas.</text><text x="455" y="606" font-size="13" font-weight="700">02  Escritório / atendimento</text><text x="665" y="606" font-size="12" fill="#65798b">3,00 x 4,00 m; recepção, facturação e controlo de mercadorias.</text><text x="455" y="628" font-size="13" font-weight="700">03  Acesso e carga</text></g>
<rect x="435" y="651" width="710" height="145" rx="9" fill="#fff" stroke="#ccd8e2"/><path d="M444 651H1136Q1145 651 1145 660V691H435V660Q435 651 444 651" fill="#082b4c"/><text x="454" y="678" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#fff">NOTAS DE VALIDAÇÃO</text>
<g font-family="Arial,sans-serif" fill="#344b60" font-size="11"><text x="455" y="713">• O estudo-base não consolida a área coberta total desta alternativa.</text><text x="455" y="733">• Confirmar topografia, limites, afastamentos, servidões e licenciamento.</text><text x="455" y="753">• Dimensionar fundações, estrutura metálica, ligações, piso e drenagem.</text><text x="455" y="773">• Validar manobras, incêndio e instalações técnicas com os projectos próprios.</text></g>
