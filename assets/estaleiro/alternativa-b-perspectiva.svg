<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
<title id="title">Perspectiva conceptual — Alternativa B</title><desc id="desc">Vista arquitectónica conceptual de um armazém ampliado com escritório frontal e corredor lateral de acesso e carga.</desc>
<defs>
 <linearGradient id="skyB" x2="0" y2="1"><stop stop-color="#dcebf5"/><stop offset="1" stop-color="#f8fafc"/></linearGradient>
 <linearGradient id="metalB" x2="0" y2="1"><stop stop-color="#244d70"/><stop offset="1" stop-color="#0b2947"/></linearGradient>
 <linearGradient id="sideB" x2="1" y2="1"><stop stop-color="#1e4262"/><stop offset="1" stop-color="#081f37"/></linearGradient>
 <linearGradient id="glassB" x2="0" y2="1"><stop stop-color="#90bed4"/><stop offset=".4" stop-color="#315d7a"/><stop offset="1" stop-color="#112f4c"/></linearGradient>
 <linearGradient id="floorB" x2="0" y2="1"><stop stop-color="#d9e1e6"/><stop offset="1" stop-color="#aebdc7"/></linearGradient>
 <filter id="shadowB" x="-30%" y="-30%" width="160%" height="170%"><feGaussianBlur stdDeviation="13"/></filter>
 <pattern id="ribsB" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M2 0V18" stroke="#708a9c" stroke-opacity=".36" stroke-width="2"/></pattern>
</defs>
