<rect x="435" y="220" width="710" height="183" rx="9" fill="#fff" stroke="#ccd8e2"/><path d="M444 220H1136Q1145 220 1145 229V260H435V229Q435 220 444 220" fill="#082b4c"/><text x="454" y="247" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#fff">QUADRO DE ÁREAS</text>
<g font-family="Arial,sans-serif" font-size="13" fill="#1a3043"><text x="455" y="287">Armazém principal</text><text x="865" y="287" text-anchor="end" fill="#65798b">8,00 x 12,00 m</text><text x="1125" y="287" text-anchor="end" font-weight="700" fill="#0b2c4a">96,00 m²</text><path d="M455 296H1125" stroke="#e1e8ee"/><text x="455" y="318">Cobertura lateral</text><text x="865" y="318" text-anchor="end" fill="#65798b">2,20 x 12,00 m</text><text x="1125" y="318" text-anchor="end" font-weight="700" fill="#0b2c4a">26,40 m²</text><path d="M455 327H1125" stroke="#e1e8ee"/><text x="455" y="349">Escritório / atendimento</text><text x="865" y="349" text-anchor="end" fill="#65798b">4,00 x 3,50 m</text><text x="1125" y="349" text-anchor="end" font-weight="700" fill="#0b2c4a">14,00 m²</text><path d="M455 358H1125" stroke="#e1e8ee"/><text x="455" y="380">Apoio técnico</text><text x="865" y="380" text-anchor="end" fill="#65798b">3,00 x 2,50 m</text><text x="1125" y="380" text-anchor="end" font-weight="700" fill="#0b2c4a">7,50 m²</text></g>
<rect x="435" y="416" width="710" height="48" rx="7" fill="#eaf2f8"/><g font-family="Arial,sans-serif" fill="#0b2c4a"><text x="454" y="445" font-size="14" font-weight="700">ÁREA COBERTA INDICATIVA TOTAL</text><text x="1125" y="446" font-size="18" text-anchor="end" font-weight="700">143,90 m²</text></g>
<rect x="435" y="480" width="710" height="155" rx="9" fill="#fff" stroke="#ccd8e2"/><path d="M444 480H1136Q1145 480 1145 489V520H435V489Q435 480 444 480" fill="#082b4c"/><text x="454" y="507" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#fff">ORGANIZAÇÃO FUNCIONAL</text>
<g font-family="Arial,sans-serif" fill="#0b2c4a"><text x="455" y="548" font-size="13" font-weight="700">01  Armazém fechado</text><text x="665" y="548" font-size="12" fill="#65798b">Stock protegido e estantes; layout interno esquemático.</text><text x="455" y="575" font-size="13" font-weight="700">02  Cobertura lateral</text><text x="665" y="575" font-size="12" fill="#65798b">Faixa de apoio à recepção e movimentação de materiais.</text><text x="455" y="602" font-size="13" font-weight="700">03  Pátio exterior</text><text x="665" y="602" font-size="12" fill="#65798b">Stock de alta rotação e apoio de carga, a confirmar.</text><text x="455" y="622" font-size="13" font-weight="700">04  Escritório e apoio técnico</text></g>
<rect x="435" y="651" width="710" height="145" rx="9" fill="#fff" stroke="#ccd8e2"/><path d="M444 651H1136Q1145 651 1145 660V691H435V660Q435 651 444 651" fill="#082b4c"/><text x="454" y="678" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#fff">NOTAS DE VALIDAÇÃO</text>
<g font-family="Arial,sans-serif" fill="#344b60" font-size="11"><text x="455" y="713">• Dimensões do lote: 15,141 x 25,000 m, conforme dados disponibilizados.</text><text x="455" y="733">• Confirmar levantamento topográfico, limites, afastamentos e servidões.</text><text x="455" y="753">• Dimensionar fundações, estrutura metálica, ligações, piso e drenagem.</text><text x="455" y="773">• Verificar incêndio, instalações técnicas e manobras dos veículos.</text></g>
<rect x="20" y="806" width="1160" height="24" fill="#082b4c"/><text x="50" y="823" font-family="Arial,sans-serif" font-size="10" fill="#fff">HM-IY-A-002 | ESTUDO PRELIMINAR | NÃO UTILIZAR PARA CONSTRUÇÃO | SUJEITO A VALIDAÇÃO PROFISSIONAL</text>
