<g font-family="Arial, sans-serif"><rect x="55" y="145" width="260" height="42" rx="7" fill="#e98b2a"/><text x="72" y="173" font-size="21" font-weight="700" fill="#fff">ALTERNATIVA A</text><text x="340" y="173" font-size="17" font-weight="700" fill="#0b2c4a">ARMAZÉM COMPACTO + COBERTURA LATERAL</text></g>
